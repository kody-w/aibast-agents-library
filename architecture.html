<style>
/* ══ ms-rapp shared design language ═════════════════════════════════════
   These tokens and the header/footer/button/card rules below are identical
   on every page of this site. Page-specific rules follow after the marker. */
:root {
  --bg: #faf9f8; --bg-soft: #f5f4f3; --panel: #ffffff; --panel-2: #f5f4f3;
  --border: #edebe9; --text: #323130; --text-dim: #605e5c; --text-faint: #a19f9d;
  --accent: #0078d4; --accent-hover: #106ebe; --accent-pressed: #005a9e;
  --accent-2: #4f52c9; --accent-soft: rgba(0,120,212,.08);
  --ok: #107c10; --warn: #d83b01; --gold: #b8912d;
  --shadow: 0 0.3px 0.9px rgba(0,0,0,.1), 0 1.6px 3.6px rgba(0,0,0,.13);
  --radius: 8px; --radius-lg: 12px; --maxw: 1180px;
}
[data-theme="dark"] {
  --bg: #1b1a19; --bg-soft: #201f1e; --panel: #252423; --panel-2: #2d2c2b;
  --border: #3b3a39; --text: #f3f2f1; --text-dim: #c8c6c4; --text-faint: #797775;
  --accent: #2899f5; --accent-hover: #3aa0f3; --accent-pressed: #6cb8f6;
  --accent-2: #9ea3f8; --accent-soft: rgba(40,153,245,.14);
  --ok: #92c353; --warn: #f1707b; --gold: #d9b24c;
  --shadow: 0 0.3px 0.9px rgba(0,0,0,.32), 0 1.6px 3.6px rgba(0,0,0,.4);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{max-width:100%;overflow-x:hidden}
body{font-family:"Segoe UI",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  color:var(--text);background:var(--bg);line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 20px}

header.site{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--bg) 86%,transparent);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
.nav{display:flex;align-items:center;gap:18px;padding:12px 0;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px;color:var(--text);white-space:nowrap}
.brand:hover{text-decoration:none}
.brand .mark{color:var(--accent);display:inline-flex}
.brand .mark svg{width:19px;height:19px}
.nav-links{display:flex;gap:4px;flex-wrap:wrap}
.nav-links a{color:var(--text-dim);font-size:13.5px;padding:5px 10px;border-radius:8px}
.nav-links a:hover{color:var(--text);background:var(--panel-2);text-decoration:none}
.nav-actions{margin-left:auto;display:flex;gap:8px;align-items:center}
.icon-btn{background:var(--panel);border:1px solid var(--border);color:var(--text-dim);
  width:32px;height:32px;border-radius:6px;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center}
.icon-btn svg{width:15px;height:15px}
.icon-btn:hover{color:var(--text);border-color:var(--text-faint);text-decoration:none}
footer.site{margin-top:20px;border-top:1px solid var(--border);padding:26px 0 44px}
.foot{display:flex;gap:20px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--text-faint)}
.foot a{color:var(--text-dim)}
.foot .copy{width:100%;margin-top:4px}
@media (max-width:560px){.nav-links{order:3;width:100%}}

.btn{display:inline-flex;align-items:center;gap:8px;padding:9px 18px;border:1px solid var(--border);
  border-radius:6px;background:var(--panel);color:var(--text);text-decoration:none;
  font-size:14px;font-weight:600;cursor:pointer;font-family:inherit}
.btn:hover{border-color:var(--text-faint);text-decoration:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
/* ══ page-specific ══ */

:root{
  --ink:#1a1a1a; --dim:#4a4a4a; --faint:#767676; --line:#e3e3e3;
  --panel:#f4f4f6; --panel-2:#ebebee; --chip:#e9e9ec;
  --gold:#c8a41e; --gold-soft:#fdf6d8; --gold-line:#e0bc3a;
  --accent:#0067b8; --page:#fff;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{max-width:100%}
body{font-family:"Segoe UI",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  background:var(--bg);color:var(--text);line-height:1.45;-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
.bar{background:#fff;border-bottom:1px solid var(--line)}
.barin{max-width:1500px;margin:0 auto;padding:11px 24px;display:flex;align-items:center;gap:14px}
.barin b{font-size:14px;font-weight:650}
.barin nav{margin-left:auto;display:flex;gap:15px;font-size:13px}
.barin nav a{color:var(--dim)}
.btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:6px;
  padding:7px 13px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}
.btn:hover{background:var(--panel)}

.sheet{max-width:1500px;margin:20px auto 40px;background:var(--page);
  border:1px solid var(--line);border-radius:10px;padding:30px 34px 34px;
  box-shadow:0 1px 8px rgba(0,0,0,.06)}
.kicker{font-size:11.5px;font-weight:600;letter-spacing:.09em;color:var(--faint);
  text-transform:uppercase}
h1{font-size:38px;font-weight:350;letter-spacing:-.01em;margin:4px 0 6px;line-height:1.1}
.sub{font-size:13px;color:var(--faint);margin-bottom:20px}

.cols{display:grid;grid-template-columns:1fr 1.25fr 1.1fr 1fr;gap:14px;align-items:stretch}
.col{background:var(--panel);border-radius:8px;padding:14px 14px 16px;display:flex;
  flex-direction:column;gap:12px;min-width:0}
.col > h2{font-size:15px;font-weight:650;text-align:center}

.group{border:1.5px dashed var(--gold-line);border-radius:7px;padding:11px;
  display:flex;flex-direction:column;gap:9px;background:rgba(255,255,255,.5)}
.group .gl{font-size:11px;font-weight:700;color:var(--gold);letter-spacing:.05em;
  text-transform:uppercase}
.item{display:flex;gap:9px;align-items:flex-start;font-size:13px;line-height:1.35}
.item .txt,.actor .txt{min-width:0}
.txt .sub{display:block;font-size:10.5px;color:var(--faint);line-height:1.3}
.actor{align-items:flex-start}

/* ---- product marks -------------------------------------------------------
   A real mark is an image of the real mark. There is no fallback that draws
   one: a product with nothing on file gets the neutral chip below and says so,
   because an approximated Microsoft logo is a trademark problem long before it
   is a design problem.                                                      */
.mk{flex:0 0 auto;width:24px;height:24px;border-radius:4px;display:flex;
  align-items:center;justify-content:center;overflow:hidden}
.mk img{max-width:24px;max-height:22px;object-fit:contain;display:block}
.mk.plain{border:1.5px dashed #c8c6c4;background:#fbfbfc;border-radius:5px}
.mk.plain:after{content:"";width:7px;height:7px;border-radius:2px;background:#c8c6c4}
.mk.unknown{border:1.5px dashed #d9d2b0;background:var(--gold-soft)}
.mk.unknown:after{content:"?";font-size:11px;font-weight:800;color:var(--gold)}
.conf{font-size:9.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
  border-radius:3px;padding:1px 4px;margin-left:6px;vertical-align:1px}
.conf.declared{background:#e4f1e4;color:#0b6a0b}
.conf.implied{background:var(--gold-soft);color:#8a6a00;border:1px solid var(--gold-line)}
.conf.platform{background:var(--chip);color:var(--faint)}

/* ---- product filter: the same idiom the catalog pages use ---------------- */
.prodbar{max-width:1500px;margin:14px auto 0;padding:0 24px;display:flex;
  flex-wrap:wrap;gap:10px;align-items:center}
.prodbar label{font-size:12px;color:var(--faint);font-weight:600}
.prodbar select{font-family:inherit;font-size:13px;padding:7px 10px;border-radius:6px;
  border:1px solid var(--line);background:#fff;color:var(--ink);min-width:250px}
.prodbar .now{font-size:12px;color:var(--faint)}
.prodlist{max-width:1500px;margin:10px auto 0;padding:0 24px}
.prodlist .box{background:#fff;border:1px solid var(--line);border-radius:9px;
  padding:14px 16px}
.prodlist h4{font-size:13px;font-weight:650;margin-bottom:3px;display:flex;
  align-items:center;gap:8px}
.prodlist h4 .mk{width:20px;height:20px}
.prodlist .why{font-size:11.5px;color:var(--faint);margin-bottom:9px}
.prodlist ul{list-style:none;display:flex;flex-wrap:wrap;gap:6px;max-height:190px;
  overflow:auto}
.prodlist li a{display:block;font-size:12px;border:1px solid var(--line);
  border-radius:5px;padding:4px 9px;color:var(--dim);background:var(--panel)}
.prodlist li a:hover{background:var(--chip);text-decoration:none}
.prodlist li a.here{border-color:var(--gold-line);background:var(--gold-soft);color:var(--ink)}
.prodlist li a .c{color:var(--faint)}

.taglist{display:flex;flex-wrap:wrap;gap:5px}
.taglist span{font-size:11.5px;background:#fff;border:1px solid var(--line);
  border-radius:4px;padding:2px 7px;color:var(--dim)}
ul.ops{list-style:none;display:flex;flex-direction:column;gap:4px}
ul.ops li{font-size:12.5px;color:var(--ink);background:var(--panel-2);
  border-radius:4px;padding:4px 8px;line-height:1.3}

.chip{background:var(--chip);border-radius:5px;padding:9px 11px;font-size:12.5px;
  line-height:1.4;color:var(--dim)}
.chip b{color:var(--ink);font-weight:650}
.card{background:#fff;border-radius:8px;padding:13px;display:flex;flex-direction:column;
  gap:11px;flex:1}
.orch{display:flex;flex-direction:column;align-items:center;gap:7px;padding:8px 0}
.orch .cube{width:52px;height:44px;border-radius:9px;
  background:linear-gradient(135deg,#e8598f 0%,#8b5cf6 45%,#4f7cf7 100%);
  box-shadow:4px -4px 0 -1px #fff,8px -8px 0 -2px rgba(139,92,246,.55)}
.orch span{font-size:13.5px;font-weight:600;text-align:center}
ul.acts{list-style:none;display:flex;flex-direction:column;gap:5px}
ul.acts li{font-size:12.5px;line-height:1.35;padding-left:13px;position:relative;color:var(--dim)}
ul.acts li:before{content:"";position:absolute;left:0;top:7px;width:6px;height:6px;
  border:1.5px solid var(--gold);border-radius:1px;transform:rotate(45deg)}
.actor{display:flex;gap:9px;align-items:center;font-size:13px}
.actor .av{width:22px;height:22px;border-radius:50%;background:#3b8de0;flex:0 0 auto;
  position:relative}
.actor .av:after{content:"";position:absolute;left:50%;top:52%;transform:translateX(-50%);
  width:14px;height:9px;border-radius:7px 7px 0 0;background:#2a6cb0}
.hl{background:var(--gold-soft);border:1px solid var(--gold-line);border-radius:6px;
  padding:10px 12px;font-size:12.5px;line-height:1.4}
.hl b{display:block;margin-bottom:3px}

.bands{margin-top:14px;display:grid;grid-template-columns:1fr 1.35fr;gap:14px}
.band{background:var(--panel);border-radius:8px;padding:14px}
.band .gl{font-size:11px;font-weight:700;color:var(--gold);letter-spacing:.05em;
  text-transform:uppercase;background:var(--gold-soft);display:inline-block;
  padding:2px 8px;border-radius:4px;margin-bottom:8px}
.band p{font-size:12.5px;color:var(--dim);line-height:1.45}
.band.found{display:flex;align-items:center;justify-content:center;gap:16px;text-align:center}
.band.found .id{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:12px}
.band.found .id .mk{width:28px;height:28px}
.band.found b{font-size:14px;font-weight:650}

.flow{margin-top:22px;border-top:1px solid var(--line);padding-top:16px}
.flow h3{font-size:13px;font-weight:650;margin-bottom:10px}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:9px}
.step{display:flex;gap:9px;font-size:12.5px;line-height:1.4;color:var(--dim)}
.step .n{flex:0 0 auto;width:20px;height:20px;border-radius:50%;background:var(--ink);
  color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}
.foot{margin-top:20px;padding-top:13px;border-top:1px solid var(--line);
  font-size:11.5px;color:var(--faint);line-height:1.5}

@media print{
  body{background:#fff}
  .bar,.noprint{display:none!important}
  .sheet{box-shadow:none;border:none;margin:0;max-width:none;padding:0}
}
@media(max-width:1100px){.cols{grid-template-columns:1fr 1fr}.bands{grid-template-columns:1fr}}
@media(max-width:640px){.cols{grid-template-columns:1fr}h1{font-size:26px}}
.deck-status{font-size:13px;color:#6B7280;margin-left:10px;align-self:center;min-height:1em}
@media print{.deck-status{display:none}}
</style>

<script>
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function qs(n){var m=new RegExp("[?&]"+n+"=([^&]*)").exec(location.search);
  return m?decodeURIComponent(m[1].replace(/\+/g," ")):"";}
function getJSON(p){var i=0;return (function next(){
  if(i>=p.length)return Promise.resolve(null);
  return fetch(p[i++],{cache:"no-cache"}).then(function(r){return r.ok?r.json():next();})
    .catch(function(){return next();});})();}

/* ---- marks ---------------------------------------------------------------
 * A real mark, always, wherever one exists. Exact when the product publishes
 * its own; its family's when it does not; the nearest real one when even that
 * is missing — and the hover text says which of the three you are looking at.
 * Only something the entry never declared draws the unknown chip.
 *
 * The old rule blanked anything without an exact mark. It was meant to avoid
 * approximating a Microsoft logo, and it still does — nothing here is drawn,
 * traced or recoloured. But a dashed blank beside "Entra ID" reads as broken
 * rather than as careful, and Entra ID's real mark was on disk the whole time.
 * ------------------------------------------------------------------------ */
function mark(x){
  if (x && x.unknown) return '<span class="mk unknown" title="Not declared by this entry"></span>';
  if (x && x.mark) {
    var t = x.mark_scope === "family"
      ? (x.family || "Family") + " mark, shown beside the app name"
      : x.mark_scope === "closest"
        ? "Nearest Microsoft mark — " + x.label + " publishes none of its own"
        : x.label + " mark";
    return '<span class="mk"><img src="' + esc(x.mark) + '" alt="' + esc(t) + '" title="' +
      esc(t) + '" loading="lazy"></span>';
  }
  return '<span class="mk plain" title="No product mark on file for ' +
    esc(x && x.label ? x.label : "this item") + ' — shown as a labelled chip"></span>';
}
function confTag(x){
  if (!x || !x.confidence || x.confidence === "unknown") return "";
  if (x.confidence === "declared") return '<span class="conf declared">declared</span>';
  if (x.confidence === "implied") return '<span class="conf implied">implied</span>';
  return '<span class="conf platform">platform</span>';
}
function item(x){
  return '<div class="item">' + mark(x) +
    '<span class="txt">' + esc(x.label) + confTag(x) +
    (x.from ? '<span class="sub">' + esc(x.from) + "</span>" : "") +
    "</span></div>";
}
function plainItem(label){
  return '<div class="item"><span class="mk plain" title="No product mark on file for ' +
    esc(label) + '"></span><span class="txt">' + esc(label) + "</span></div>";
}

function render(a){
  var c=a.columns;
  // Which products in THIS diagram have no published mark on file. Recorded on
  // the page rather than quietly papered over with a drawn-on lookalike.
  var noMark=[];
  (a.products||[]).forEach(function(p){
    if(p.mark_status!=="mark" && noMark.indexOf(p.name)===-1) noMark.push(p.name);
  });
  document.title=a.display_name+" — reference architecture";
  var op=document.getElementById("opLink");
  op.href="onepager.html?"+(a.kind==="agent"?"agent=":"solution=")+encodeURIComponent(a.ref||a.slug);

  var html='<div class="sheet">' +
    '<div class="kicker">Reference architecture · generated</div>' +
    "<h1>Architecture for "+esc(a.display_name)+"</h1>" +
    '<div class="sub">'+esc((a.industries||[]).join(" · "))+
      (a.industries&&a.industries.length?" · ":"")+
      "derived from what this entry declares — a shape for a working deployment, "+
      "not a deployment anyone has made.</div>" +

    '<div class="cols">' +

      /* Knowledge */
      '<div class="col"><h2>'+esc(c.knowledge.title)+"</h2>" +
        '<div class="group"><div class="gl">Grounding data</div>' +
          c.knowledge.grounding.map(item).join("") + "</div>" +
        ((c.knowledge.subject_areas||[]).length
          ? '<div class="group"><div class="gl">Subject areas it declares</div>' +
            '<div class="taglist">' + c.knowledge.subject_areas.map(function(t){
              return "<span>"+esc(t)+"</span>"; }).join("") + "</div></div>"
          : "") +
        '<div class="group"><div class="gl">Connectors &amp; actions</div>' +
          c.knowledge.connectors.map(plainItem).join("") + "</div>" +
        '<div class="chip">'+esc(c.knowledge.note)+"</div>" +
      "</div>" +

      /* Processing */
      '<div class="col"><h2>'+esc(c.processing.title)+"</h2>" +
        '<div class="card">' +
          '<div class="chip"><b>3.</b> '+esc(c.processing.plan)+"</div>" +
          '<div class="orch"><div class="cube"></div><span>'+
            esc(c.processing.orchestration)+"</span></div>" +
          ((c.processing.operations||[]).length
            ? '<div class="group"><div class="gl">Operations it accepts</div>' +
              '<ul class="ops">' + c.processing.operations.map(function(o){
                return "<li>"+esc(o)+"</li>"; }).join("") + "</ul>" +
              (c.processing.parameters && c.processing.parameters.length
                ? '<div class="chip">Parameters: <b>' +
                  c.processing.parameters.map(esc).join("</b>, <b>") + "</b></div>"
                : "") + "</div>"
            : "") +
          '<ul class="acts">'+c.processing.actions.map(function(x){
            return "<li>"+esc(x)+"</li>";}).join("")+"</ul>" +
          ((c.processing.model||[]).length
            ? '<div class="group"><div class="gl">Model</div>' +
              c.processing.model.map(item).join("") + "</div>" : "") +
        "</div>" +
      "</div>" +

      /* User interface */
      /* Ordered so the numbers read down the column: the operator, then what
         they type (1), then what happens to it (2), then what comes back (6).
         Step 2 used to sit above step 1, which makes a numbered flow harder to
         follow than an unnumbered one. */
      '<div class="col"><h2>'+esc(c.interface.title)+"</h2>" +
        '<div class="group"><div class="gl">' +
          (c.interface.surface_declared ? "Where the operator meets it"
                                        : "Surface — not declared") + "</div>" +
          c.interface.surfaces.map(item).join("") + "</div>" +
        '<div class="card" style="flex:0">' +
          c.interface.actors.map(function(x){
            var label = x && x.label ? x.label : x;
            return '<div class="actor"><span class="av"></span><span class="txt">'+
              esc(label) + (x && x.declared === false
                ? '<span class="sub">' + esc(x.note || "not declared") + "</span>" : "") +
              "</span></div>";
          }).join("") +
          '<div class="chip"><b>1.</b> '+esc(a.flow[0].text)+"</div>" +
        "</div>" +
        '<div class="chip"><b>2.</b> '+esc(c.interface.checks)+"</div>" +
        '<div class="chip"><b>6.</b> Feedback</div>' +
      "</div>" +

      /* Reporting */
      '<div class="col"><h2>'+esc(c.reporting.title)+"</h2>" +
        '<div class="hl"><b>Governance, risk &amp; compliance</b>'+
          esc(c.reporting.governance)+"</div>" +
        '<div class="card" style="flex:0">'+c.reporting.systems.map(item).join("")+"</div>" +
        '<div class="hl"><b>Insights</b>'+esc(c.reporting.insights)+"</div>" +
      "</div>" +

    "</div>" +

    '<div class="bands">' +
      '<div class="band"><span class="gl">Tools</span><p>'+esc(a.tools_band)+"</p></div>" +
      '<div class="band found"><div class="id">' +
        mark(a.foundation_band) + esc(a.foundation_band.identity)+"</div>" +
        "<b>"+esc(a.foundation_band.label)+"</b></div>" +
    "</div>" +

    '<div class="flow"><h3>The request, end to end</h3><div class="steps">' +
      a.flow.map(function(s){
        return '<div class="step"><span class="n">'+s.step+"</span><span>"+esc(s.text)+"</span></div>";
      }).join("") + "</div></div>" +

    '<div class="foot">' +
      "Derived from what this entry declares — its description, its tags, its " +
      "configuration and the operations in its own tool schema" +
      (a.derivation && a.derivation.signals
        ? " · " + a.derivation.signals.tool_schema + " declared operation" +
          (a.derivation.signals.tool_schema === 1 ? "" : "s") + " · " +
          a.derivation.signals.products_declared + " product" +
          (a.derivation.signals.products_declared === 1 ? "" : "s") + " named outright, " +
          a.derivation.signals.products_implied + " implied by a tag it carries"
        : "") +
      (a.configuration && a.configuration.length
        ? " · configuration: " + a.configuration.map(esc).join(", ") : "") +
      (a.derivation.unclassified.length
        ? " · left unclassified rather than guessed: " +
          a.derivation.unclassified.map(esc).join(", ")
        : "") +
      (noMark.length
        ? " · no published mark on file, so drawn as a labelled chip: " +
          noMark.map(esc).join(", ")
        : "") +
      ". Microsoft AI Business Applications Specialist Team · synthetic data, no PII." +
    "</div>" +
  "</div>";

  document.getElementById("host").innerHTML=html;
}

/* ---- filter the library by the product an entry involves ------------------
 * Same idiom as the industry filter on the catalog pages — one select, counts
 * in the option text, re-render on change. Grouped by family so Dynamics 365
 * and its apps sit together and can be picked at either level.
 * ------------------------------------------------------------------------ */
var PRODUCTS=null, HERE="";

function wireProducts(doc, hereSlug){
  if(!doc) return;
  PRODUCTS=doc; HERE=hereSlug;
  var sel=document.getElementById("fProd"), bar=document.getElementById("prodbar");
  var byFamily={}, order=[];
  (doc.products||[]).forEach(function(p){
    if(!p.entry_count) return;
    if(!byFamily[p.family]){ byFamily[p.family]=[]; order.push(p.family); }
    byFamily[p.family].push(p);
  });
  order.forEach(function(fam){
    var g=document.createElement("optgroup"); g.label=fam;
    byFamily[fam].forEach(function(p){
      var o=document.createElement("option");
      o.value=p.id;
      o.textContent=(p.app ? "— " + p.app : p.name) + " (" + p.entry_count + ")";
      g.appendChild(o);
    });
    sel.appendChild(g);
  });
  // Whole-family option, so "everything touching Dynamics 365" is one pick.
  order.forEach(function(fam){
    var n=0;
    (doc.entries||[]).forEach(function(e){
      if((e.products||[]).some(function(x){ return productOf(x.id).family===fam; })) n++;
    });
    if(!n) return;
    var o=document.createElement("option");
    o.value="family:"+fam; o.textContent="All of " + fam + " (" + n + ")";
    sel.insertBefore(o, sel.children[1] || null);
  });
  bar.hidden=false;
  sel.addEventListener("change", renderProducts);

  var mine=(doc.entries||[]).filter(function(e){ return e.slug===hereSlug; })[0];
  var now=document.getElementById("prodNow");
  if(mine){
    now.textContent = mine.products.length
      ? "This entry involves " + mine.products.length + ": " +
        mine.products.map(function(p){ return productOf(p.id).name; }).join(", ")
      : "This entry names no Microsoft product.";
  }
}

function productOf(id){
  var list=(PRODUCTS && PRODUCTS.products) || [];
  for(var i=0;i<list.length;i++) if(list[i].id===id) return list[i];
  return {id:id,name:id,family:"",app:null,mark:null,mark_status:"labelled-chip"};
}

/* A family picked as a whole borrows the family's own mark when there is one —
 * the Dynamics 365 mark IS the mark for "all of Dynamics 365". If the family
 * has no mark on file it stays a labelled chip like any other. */
function familyHead(fam){
  var list=(PRODUCTS && PRODUCTS.products) || [];
  for(var i=0;i<list.length;i++){
    if(list[i].family===fam && list[i].mark && list[i].mark_scope==="exact"){
      return {id:"family:"+fam, name:"All of "+fam, family:fam, app:null,
              mark:list[i].mark, mark_scope:"exact", mark_status:"mark"};
    }
  }
  return {id:"family:"+fam, name:"All of "+fam, family:fam, app:null,
          mark:null, mark_scope:null, mark_status:"labelled-chip"};
}

function renderProducts(){
  var v=document.getElementById("fProd").value;
  var host=document.getElementById("prodlist");
  if(!v || !PRODUCTS){ host.innerHTML=""; return; }
  var fam=v.indexOf("family:")===0 ? v.slice(7) : null;
  var p=fam ? familyHead(fam) : productOf(v);
  var hits=(PRODUCTS.entries||[]).filter(function(e){
    return (e.products||[]).some(function(x){
      return fam ? productOf(x.id).family===fam : x.id===v; });
  });
  var declared=0;
  hits.forEach(function(e){
    (e.products||[]).forEach(function(x){
      var m = fam ? productOf(x.id).family===fam : x.id===v;
      if(m && x.confidence==="declared") declared++;
    });
  });
  host.innerHTML='<div class="box"><h4>' +
      mark({label:p.name, mark:p.mark, mark_scope:p.mark_scope, family:p.family}) +
      esc(p.name) + " · " + hits.length + " entr" + (hits.length===1?"y":"ies") + "</h4>" +
    '<div class="why">' + declared + " named it outright; the rest carry a tag or " +
      "category that points at it. An entry that declares neither is not listed — " +
      "an unknown stays unknown." + (p.mark_status==="mark" ? "" :
        " No published mark on file for this product, so it is drawn as a labelled chip.") +
    "</div><ul>" +
    hits.map(function(e){
      var kindQ=(e.kind==="agent"?"agent=":"solution=")+encodeURIComponent(e.ref||e.slug);
      return "<li><a" + (e.slug===HERE ? ' class="here"' : "") +
        ' href="architecture.html?' + kindQ + '">' + esc(e.display_name) +
        (e.industries && e.industries.length
          ? ' <span class="c">· ' + esc(e.industries[0]) + "</span>" : "") + "</a></li>";
    }).join("") + "</ul></div>";
}

(function boot(){
  var sol=qs("solution"), ag=qs("agent"), ref=sol||ag;
  if(!ref){
    document.getElementById("host").innerHTML =
      '<div class="sheet"><b>Nothing to draw.</b><br>Add <code>?solution=&lt;slug&gt;</code> ' +
      'or <code>?agent=&lt;name&gt;</code>.<br><br><a href="solutions.html">Browse solutions</a></div>';
    return;
  }
  var slug=ref.split("/").pop();
  getJSON(["api/v1/architectures.json","data/architectures.json"]).then(function(doc){
    if(!doc){ document.getElementById("host").innerHTML =
      '<div class="sheet">The architecture catalog could not be loaded.</div>'; return; }
    var a=(doc.architectures||[]).filter(function(x){
      return x.slug===slug || x.ref===ref; })[0];
    if(!a){ document.getElementById("host").innerHTML =
      '<div class="sheet">No architecture for '+esc(ref)+'.</div>'; return; }
    render(a);
    getJSON(["api/v1/products.json","data/products.json"]).then(function(pd){
      wireProducts(pd, a.slug);
    });
    // Same data, same deck: the architecture page exports the diagram's own
    // layers as native slides rather than a printout of the page.
    var btn=document.getElementById("deckArch"), st=document.getElementById("deckArchStatus");
    if(btn){ btn.onclick=function(){
      var say=function(m){ if(st) st.textContent=m; };
      btn.disabled=true;
      var kind = a.kind || (a.ref && a.ref.indexOf("skill")>-1 ? "skill" : "agent");
      var panels={};
      (a.layers||a.panels||[]).slice(0,3).forEach(function(L){
        panels[L.label||L.name||"Layer"]=(L.items||L.nodes||[]).map(function(x){
          return x.label||x.name||String(x); }).slice(0,4);
      });
      var story = Object.keys(panels).length
        ? {scenes:[{act:"overview",panels:panels}],
           subject:{display_name:a.display_name||a.title||slug}} : null;
      RappDeck.export({kind:kind, entry:a, story:story, onStatus:say,
        links:["Library: microsoft.github.io/aibast-agents-library"]})
        .catch(function(){})
        .then(function(){ btn.disabled=false; });
    };}
  });
})();
</script>
