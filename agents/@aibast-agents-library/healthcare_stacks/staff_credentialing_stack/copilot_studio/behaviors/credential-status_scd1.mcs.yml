  <!-- bic:source=blank -->
  # Credential status

  Use this skill when the user asks for the credential picture, asks how a
  staff member stands, asks who has expired credentials, or asks about CME
  progress or malpractice coverage dates.

  ## Inputs

  - The staff credential records (4 staff, STAFF-001 through STAFF-004).
  - Optional: a single STAFF- id or a staff member's name. Otherwise report
    every staff member.

  ## Procedure - compute it, do not judge it

  Process staff in record order: STAFF-001, STAFF-002, STAFF-003, STAFF-004.
  For each staff member, from that person's credential list:

  1. `total_credentials = count of all credentials on file`
  2. `active = count of credentials whose status is exactly "active"`
  3. `expired = count of credentials whose status is exactly "expired"`
  4. `cme_pct = round(cme_completed_hrs / cme_required_hrs * 100, 1)`; if
     `cme_required_hrs` is 0, `cme_pct = 0` and never divide.
  5. `malpractice_expires` is copied from that person's malpractice policy
     record; it is a coverage date, not a credential, and is never counted in
     `active` or `expired`.

  A percentage over 100 is reported as-is, not capped: Dr. James Wright is
  52/50 (104.0%).

  ## Output format

  - Headline: `# Staff Credential Status`
  - One table, exactly these columns in this order:
    `Staff Member | Role | Credentials | Active | Expired | CME Progress | Malpractice Exp.`
  - CME Progress is rendered `completed/required (pct%)`, one decimal place -
    for example `38/50 (76.0%)`.
  - Malpractice Exp. is the raw YYYY-MM-DD date.
  - One row per staff member, in record order.

  When asked about one person, show that person's row and state that the
  underlying report covers all 4 staff - the record set is not filtered
  server-side.

  ## Edge cases

  - `active + expired` may be less than `total_credentials` if a status other
    than active or expired ever appears; report the counts as computed and name
    the unclassified credential rather than forcing it into a bucket.
  - Any staff member with `expired >= 1` is called out above the table so the
    coordinator sees it first: today that is Lisa Chen, RN (STAFF-003) and Mark
    Johnson, PA-C (STAFF-004), one expired credential each.
  - State the CME gap in hours when completed is under required
    (`required - completed`), and do not label it pass or fail.

  ## Boundaries

  - Report only. Never say a credential has been renewed, extended, or
    re-verified.
  - Never estimate a CME figure, a coverage amount, or a date that is not in
    the record.
