  <!-- bic:source=blank -->
  # Revenue impact

  Use this skill when the user asks what the cross-sell pipeline is worth in
  total, asks for a portfolio or book-level view, asks how much expansion
  revenue is available, or asks about projected margin.

  ## Inputs

  - The full customer ownership record, the product catalog, and the affinity
    rules.
  - No customer parameter applies. This analysis is always portfolio-wide. If
    the user names a customer, run it anyway and say the totals cover all five
    customers, then offer the per-customer scan.

  ## Procedure

  1. For every customer in the ownership record, build their opportunity list
     using the same firing rule (owns `if_owns`, does not own `recommend`).
  2. Per customer compute:
     `potential_ARR = sum(annual_price)`
     `weighted = sum(annual_price x success_rate)`
  3. Accumulate every opportunity from every customer into one pool and
     compute:
     `total_opportunities = count of pooled opportunities`
     `total_potential_ARR = sum(annual_price)`
     `weighted_pipeline = sum(annual_price x success_rate)`
     `projected_margin = sum(annual_price x margin_pct / 100)`
  4. Report customers in roster order (CUST-001 through CUST-005), not sorted
     by value.

  ## Output format

  - Headline: `**Cross-Sell Revenue Impact Analysis**`
  - Per-customer table with columns
    `Customer | Segment | Current ARR | Opps | Potential ARR | Weighted`.
  - `**Portfolio Totals:**` then a `Metric | Value` table with exactly: Total
    Opportunities, Total Potential ARR, Weighted Pipeline, Projected Margin.

  ## The figures this data produces

  | Customer | Segment | Current ARR | Opps | Potential ARR | Weighted |
  |---|---|---|---|---|---|
  | Meridian Corp | Enterprise | $84,000 | 3 | $71,000 | $39,960 |
  | Atlas Digital | Mid-Market | $42,000 | 3 | $35,000 | $14,290 |
  | Pinnacle Health | Enterprise | $60,000 | 3 | $51,000 | $27,800 |
  | Greenleaf Retail | Mid-Market | $24,000 | 3 | $38,000 | $15,880 |
  | Beacon Financial | Enterprise | $113,000 | 1 | $8,000 | $5,200 |

  Totals: 13 opportunities, $203,000 potential ARR, $103,130 weighted
  pipeline, $169,920 projected margin.

  ## Edge cases and honest caveats

  - **Projected margin exceeds weighted pipeline** ($169,920 against $103,130)
    because margin is computed on the full unweighted price while pipeline
    applies the win rate. State that when reporting both; never present margin
    as expected profit.
  - **Greenleaf Retail's potential ARR ($38,000) exceeds its current ARR
    ($24,000)** - flag the expansion multiple, and flag that its health score
    is 65/100, the lowest in the book.
  - **Beacon Financial has the highest current ARR ($113,000) and the smallest
    opportunity ($8,000)** because it already owns four catalog products.
    That is saturation, not a data problem.
  - The pooled count includes duplicate product paths (Meridian's two
    Analytics Pro rows), so the totals count rule paths, not distinct
    contracts. Say so rather than presenting $203,000 as bookable revenue.

  ## Boundaries

  - Reporting only. Never forecast beyond the arithmetic above, never assign a
    close date, never state that a number has been committed to a forecast.
  - Cite CUST- ids alongside customer names.
