  <!-- bic:source=blank -->
  # Root cause analysis

  Use this skill when the user asks why we are losing, what is driving the
  losses, what the root cause is, or why a specific competitor is beating us.

  ## Inputs

  - The Q3 closed-opportunity record, filtered to losses.
  - The analysis is scoped to the **top competitor** - the highest loss count
    excluding No Decision. That is CompetitorX with 29 of the 78 Q3 losses.

  ## Procedure - the exact rules

  1. Filter to Q3 losses where `competitor_lost_to == CompetitorX` (29 deals).
  2. Count and sum value per `loss_reason`. Frequency =
     `round(count / 29 * 100, 1)` - the denominator is the competitor's loss
     count, not all 78 losses.
  3. Impact tier, by frequency: `>= 25%` is **High**, `>= 10%` is **Medium**,
     below 10% is **Low**. No judgment, no override.
  4. Addressability is a fixed lookup: security_certs = "Yes (6 months)";
     enterprise_references = "Yes (3 months)"; pricing = "Yes (immediate)";
     feature_gaps = "Roadmap item"; no_decision = "Partially (nurture)";
     relationship = "Yes (engagement plan)".
  5. **Sort the table by count, descending.**
  6. Deep dive the top two reasons only. Security = 12 deals, $7,450,000
     pipeline. References = 7 deals, $3,205,000 pipeline. Report the deal count
     and the summed pipeline exactly.
  7. Interview insight: `surveyed = min(12 + 7, 10) = 10`,
     `preferred = int(10 * 0.8) = 8` - "8 of 10 lost buyers said they preferred
     our UX but couldn't justify the security/reference risk."

  ## Output format

  - Headline: `**Root Cause Analysis - Losses to CompetitorX:**`
  - Table `| Reason | Frequency | Impact | Addressable? |`, count-descending:
    Security certifications 41.4% / High / Yes (6 months); Enterprise references
    24.1% / Medium / Yes (3 months); Pricing/packaging 17.2% / Medium / Yes
    (immediate); Feature gaps 10.3% / Medium / Roadmap item; Relationship/trust
    6.9% / Low / Yes (engagement plan).
  - `**Deep Dive - Security (12 deals, $7,450,000 pipeline):**` - CompetitorX
    holds FedRAMP (we do not); they lead with SOC 2 Type II + ISO 27001 in every
    proposal; enterprise buyers require these for procurement approval; buyer
    quote "We loved the product but couldn't get past security review".
  - `**Deep Dive - References (7 deals, $3,205,000 pipeline):**` - CompetitorX
    has 12 Fortune 500 reference logos, we have 3 enterprise references; buyers
    want peer validation at their scale; buyer quote "We need peer validation
    from companies our size before we commit".
  - `**Win/Loss Interview Insight:** 8 of 10 lost buyers ...`
  - `Source: [Win/Loss Surveys + Gong Calls + Competitive Intel]`
  - `Agents: RootCauseAnalysisAgent, PatternRecognitionAgent`

  ## Edge cases

  - A deep dive section is omitted entirely when its reason has zero deals for
    the top competitor. Do not print an empty section or a placeholder.
  - The interview insight is omitted when both deep-dive reasons are empty.
  - `no_decision` never appears in this table - those 17 losses have no
    `competitor_lost_to` and are excluded by the competitor filter. If asked
    about them, say they are counted as No Decision in the overview.

  ## Boundaries

  - Diagnosis only. Do not propose the fix here; that is counter-strategies.
  - Impact tiers come from the thresholds above and nothing else. Never promote
    a Low to a High because a deal was large.
