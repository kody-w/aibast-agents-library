  <!-- bic:source=blank -->
  # Fee calculation

  Use this skill when the user asks what a permit costs, asks for a fee
  estimate or fee breakdown, or asks how a fee figure was reached.

  ## Inputs

  - Optional: a `BP-` permit id. With a recognized id, calculate that permit
    only. Without one - or with an id not in the application file - calculate
    every permit on file.

  ## Procedure - the formula is fixed

  For every fee category, in the schedule's own order:

  `amount = base + (valuation / 1000) x per_thousand_rate`, rounded to 2
  decimal places.

  | Fee category | Base | Per $1,000 of valuation |
  |---|---|---|
  | plan_review | $250 | $4.50 |
  | building_permit | $150 | $8.75 |
  | electrical | $75 | $1.25 |
  | plumbing | $75 | $1.25 |
  | mechanical | $75 | $1.00 |
  | fire_review | $200 | $2.00 |
  | technology_surcharge | $25 | $0.50 |

  The total is the sum of the seven rounded category amounts, rounded to 2
  decimals. Equivalently, `total = 850 + (valuation / 1000) x 19.25` - the
  bases sum to $850 and the rates sum to $19.25 per $1,000. Use that identity
  only to check your arithmetic; always render the seven line items.

  Worked example - BP-2025-0101, valuation $4,200,000:
  plan review `250 + 4200 x 4.50 = 19,150.00`; building permit
  `150 + 4200 x 8.75 = 36,900.00`; electrical and plumbing
  `75 + 4200 x 1.25 = 5,325.00` each; mechanical
  `75 + 4200 x 1.00 = 4,275.00`; fire review `200 + 4200 x 2.00 = 8,600.00`;
  technology surcharge `25 + 4200 x 0.50 = 2,125.00`; total `$81,700.00`.

  Every category applies to every permit type. There is no trade-scope
  exemption, no minimum, no cap, and no valuation tier in this schedule.

  ## Output format

  - `# Permit Fee Calculation`
  - Per permit: `## BP-YYYY-NNNN: <applicant>`
  - `**Project Valuation:** $N` (whole dollars, no cents)
  - Table `Fee Category | Amount` with the seven categories in schedule order,
    names in Title Case (`Plan Review`, `Building Permit`, `Electrical`,
    `Plumbing`, `Mechanical`, `Fire Review`, `Technology Surcharge`), amounts
    as `$N,NNN.NN`
  - Final row `| **Total** | **$N,NNN.NN** |`

  ## Edge cases

  - Multiple permits in one answer: repeat the block per permit. Do not add a
    grand total across permits - the schedule produces a per-permit total.
  - An unrecognized permit id falls through to the all-permits view; say
    explicitly that the id was not found and that you are showing all permits
    on file.
  - Asked for a valuation not on file: compute it with the same formula and
    label it a hypothetical, not a permit fee of record.

  ## Boundaries

  - These are estimates from the declared valuation, not an invoice and not a
    payment record. Never waive, reduce, refund, or defer a fee, and never
    state that a fee has been paid or billed.
