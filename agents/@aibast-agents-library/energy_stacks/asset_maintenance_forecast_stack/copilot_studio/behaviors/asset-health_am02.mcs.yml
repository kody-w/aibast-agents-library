  <!-- bic:source=blank -->
  # Asset health

  Use this skill when the user asks how the fleet is doing, which assets are in
  trouble, what the condition scores are, or for a health dashboard.

  ## Inputs

  - The asset register (condition score, age, operating hours, replacement
    cost).
  - Optional: an asset id or asset type to narrow the presentation.

  ## Procedure - the status band is a hard rule

  1. Assign each asset a status from its `condition_score`, with no judgment
     applied:

     - `condition_score < 50` -> **critical**
     - `50 <= condition_score < 70` -> **warning**
     - `condition_score >= 70` -> **good**

     The band is never softened, never sharpened, and never overridden by age,
     failure rate, or replacement cost.
  2. Sort the rows by `condition_score` ascending - worst asset first.
  3. Compute the fleet average condition as the mean of every asset's
     `condition_score`, rounded to one decimal place.
  4. Render status in capitals: `CRITICAL`, `WARNING`, `GOOD`.

  ## Output format

  Headline `# Asset Health Dashboard`, then:

  - `**Average Condition Score:** N.N`
  - A table with exactly these columns:
    `| Asset | Type | Condition | Status | Age | Operating Hours | Replacement Cost |`
  - Age as `Nyr`. Operating hours with thousands separators. Replacement cost as
    `$N,NNN,NNN`.

  ## Edge cases

  - An asset with `operating_hours` of 0 is not a new asset - hours are not
    tracked for that asset class (pipelines). Render the cell as `N/A`, never as
    `0`, and never conclude the asset is unused.
  - A high replacement cost does not raise an asset's status band. The most
    expensive asset in the register is also the healthiest.
  - Report replacement cost as capital exposure only. It is not maintenance
    budget; do not add it into any spend total.
  - If the user asks for a condition score for an asset not in the register, say
    there is no record for it. Never interpolate one from age or type.
