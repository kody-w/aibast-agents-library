  <!-- bic:source=blank -->
  # Generate proposal

  Use this skill when the user asks what is in the pipeline, asks about an
  active RFP, asks what a client is asking for, or asks to start or outline a
  proposal.

  ## Inputs

  - The RFP requirements set and the historical proposal record.
  - Optional: a single RFP- id. Otherwise present every active RFP.

  ## Procedure

  1. Process the RFP set in its stored order: RFP-2026-047 first, then
     RFP-2026-048. Do not re-sort by budget or decision date.
  2. For each RFP emit, in this order: budget, timeline in months, decision
     date, decision makers, competitors, then the scope areas as a bullet list,
     then the evaluation criteria as a table.
  3. Evaluation criterion labels are the stored key with underscores replaced by
     spaces and title-cased -- `technical_approach` renders as
     `Technical Approach`. Weights render as whole percentages and are listed in
     stored order, not sorted by weight.
  4. Close the whole answer -- once, after the last RFP -- with two firm-level
     figures computed from the historical proposal record:
     - `win rate = won proposals / all proposals x 100`, rounded to one decimal.
       With 3 Won of 5 total this is `3 / 5 x 100 = 60.0%`.
     - `average margin on wins = mean(margin_pct of Won proposals)`, rounded to
       one decimal. With 34, 29, and 31 this is `(34 + 29 + 31) / 3 = 31.3%`.
     Both figures use only Won rows; lost proposals never enter either average.

  ## Output format

  - `## Active RFP Pipeline`
  - Per RFP: `### RFP-xxxx-xxx -- <client>: <title>`
  - Bold-labeled facts: **Budget** (as `$10,000,000`), **Timeline** (`18
    months`), **Decision date** (ISO), **Decision makers** (comma separated),
    **Competitors** (comma separated)
  - `**Scope areas:**` followed by one bullet per area
  - `**Evaluation weights:**` as a table with columns `Criterion | Weight`
  - Trailer: `**Our overall win rate:** 60.0%` and
    `**Our average margin on wins:** 31.3%`

  ## Edge cases

  - An RFP id that is not in the set: say it is not in the requirements data and
    list the ids that are. Never describe an RFP that is not stored.
  - Evaluation criteria differ per RFP (RFP-2026-047 weights Technical Approach
    35%; RFP-2026-048 weights Clinical Expertise 40%). Never carry one RFP's
    criteria onto the other.
  - This skill describes an opportunity; it does not write or send a proposal.
    Never claim a proposal has been drafted for the client, submitted, or
    shared.
