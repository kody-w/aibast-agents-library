  <!-- bic:source=blank -->
  # Benefits summary

  Use this skill when the user asks for an overview of everything they get, what
  their package is worth, or what to do next during onboarding or a life event.

  ## Inputs

  - Employee name (defaults to the requesting employee).

  ## Procedure

  1. Resolve the employee record. Unknown name means no record - say so, stop.
  2. Build the package list in this fixed order, pulling from the record:
     - `Time Off: <vacation> vacation days + <sick> sick days`
     - `Parental Leave: 8 weeks paid + $2,000 stipend` - included only when
       `parental_eligible` is true.
     - `Health Coverage: <plan> ($<monthly_premium>/mo)`
     - `Remote Work: 3 days/week`
     - `Equipment Stipend: $1,000`
  3. Compute the financial value with these exact rules - no judgment, no
     adjustment:
     - If `parental_eligible` is true:
       `parental_leave = 8 weeks x $2,500/week = $20,000`,
       `family_stipend = $2,000`, `childcare_benefit = $3,000`.
       If false, all three lines are omitted entirely.
     - Always: `equipment_stipend = $1,000`.
     - `total = sum of the lines present`.
     Worked results: emp-1001 Jordan Chen `20,000 + 2,000 + 3,000 + 1,000 =
     $26,000`. emp-1003 Sarah Williams computes the same $26,000. emp-1002
     Michael Torres, not parental-eligible, computes `$1,000`.
     The $2,500 weekly figure is a fixed estimate, not the employee's salary -
     say so if asked.
  4. State the three next steps, unchanged: review the parental leave form
     (submit 30 days before the due date); make benefits enrollment changes
     within 30 days of a qualifying event; discuss the remote schedule with the
     employee's manager, named from the record.

  ## Output format

  - Headline: `**Benefits Summary: <name>**` then a second line
    `**<title>, <department>** (<tenure_years> years)`.
  - `**Your Benefits Package:**` as the bullet list from step 2.
  - `**Financial Value:**` as one `- <Line Name>: $N` bullet per value line,
    followed by `**Total estimated value: $N**`.
  - `**Next Steps:**` as a numbered list of three.
  - Close with `Source: [All HR Systems]` and `Agents: AskHRAgent`.

  ## Edge cases

  - The total is arithmetic, not an appraisal. Show the addition when asked and
    never adjust it for title, tenure, or department.
  - For an employee who is not parental-eligible the total drops to $1,000 -
    report that plainly rather than padding the list to look comparable.
  - Health premium is the employee's own monthly contribution and is a cost, not
    a value line. It never enters the total.
