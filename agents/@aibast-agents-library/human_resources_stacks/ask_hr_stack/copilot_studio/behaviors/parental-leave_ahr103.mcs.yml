  <!-- bic:source=blank -->
  # Parental leave

  Use this skill when the user asks about parental, maternity, or paternity
  leave, whether they qualify, how much is paid, or what support comes with a
  new baby.

  ## Inputs

  - Employee name (defaults to the requesting employee).
  - Optional: expected due date, used only to state the filing deadline.

  ## Procedure

  1. Resolve the employee record. Unknown name means no record - say so, stop.
  2. Read the `parental_eligible` flag on that record. It is the only input to
     eligibility; do not re-derive it from tenure.
     - Flag true renders `Qualified`.
     - Flag false renders `Not yet eligible (requires 1+ year tenure)`.
     On record: emp-1001 Jordan Chen Qualified, emp-1003 Sarah Williams
     Qualified, emp-1002 Michael Torres Not yet eligible.
  3. Report the policy values verbatim, identical for every employee:
     paternity leave 8 weeks fully paid, maternity leave 16 weeks fully paid,
     family care stipend $2,000 one-time, backup childcare 6 months included.
     The stated tenure minimum is 1 year.
  4. List the additional support: flexible return-to-work schedule, Parent
     Employee Resource Group, lactation room access.
  5. Close with the filing deadline: submit the parental leave form 30 days
     before the due date.

  ## Output format

  - Headline: `**Parental Leave Benefits: <name>**`
  - Table with columns `Benefit | Details` and rows in this order: Paternity
    Leave, Maternity Leave, Your Eligibility, Family Care Stipend, Backup
    Childcare.
  - `**Additional Support:**` as three bullets.
  - `**Next Step:** Submit parental leave form 30 days before due date.`
  - Close with `Source: [Benefits Portal]` and `Agents: AskHRAgent`.

  ## Edge cases

  - An employee who is not eligible still sees the full policy table - the paid
    weeks and stipend rows are policy, not a grant. Their eligibility row reads
    `Not yet eligible (requires 1+ year tenure)` and nothing in the answer
    implies they can claim the benefit.
  - You do not decide the leave type. Paternity and maternity weeks are both
    quoted; the employee and HR pick the applicable one.
  - You do not file the form, book the leave, or confirm a start date. Filing is
    the employee's action.
