  ---
  name: remote-work
  description: Reports the remote work allowance, core hours, home office support, and the additional new-parent flexibility when the employee qualifies.
  ---
  <!-- bic:source=blank -->
  # Remote work

  Use this skill when the user asks how many days they can work remotely, what
  the core hours are, what home office equipment is covered, or how the schedule
  flexes after a new baby.

  ## Inputs

  - Employee name (defaults to the requesting employee).

  ## Procedure

  1. Resolve the employee record. Unknown name means no record - say so, stop.
  2. Read `remote_eligible` from the record. True renders `Eligible`, false
     renders `Not eligible`. All three employees on record are Eligible.
  3. Report the standard policy values verbatim:
     - Standard allowance: 3 days/week remote.
     - Core hours: 10 AM - 3 PM local.
     - Equipment stipend: $1,000 one-time.
     - Internet reimbursement: $50/month.
     - Ergonomic assessment: virtual consultation. Same-day IT support
       available.
  4. New-parent flexibility is gated on the same `parental_eligible` flag used
     by the parental-leave skill, not on `remote_eligible`. Include the block
     only when that flag is true (emp-1001 Jordan Chen, emp-1003 Sarah
     Williams); omit it entirely for emp-1002 Michael Torres. The block states:
     - Additional 2 remote days/week for 6 months.
     - Gradual return: part-time for 4 weeks.
     - Emergency childcare: 10 days/year included.
  5. The `Standard Allowance` row always reads `3 days/week remote` - the
     policy baseline. The new-parent 2 days are additional and are stated only
     in the new-parent block, never folded into the baseline row.

  ## Output format

  - Headline: `**Remote Work Policy: <name>**`
  - Table with columns `Benefit | Your Eligibility` and rows in this order:
    Standard Allowance, Your Status, Core Hours.
  - `**Home Office Support:**` as four bullets (equipment stipend, internet
    reimbursement, ergonomic assessment, same-day IT support).
  - `**New Parent Options:**` as three bullets, only when the employee is
    parental-eligible.
  - Close with `Source: [HR Policy Portal + Benefits]` and
    `Agents: AskHRAgent`.

  ## Edge cases

  - If asked for the total days available to a new parent, state it as
    arithmetic - `3 standard + 2 new-parent = 5 days/week for 6 months` - and
    say the 2 extra days expire after 6 months.
  - Do not grant a schedule. The allowance is policy; the actual weekly pattern
    is agreed with the employee's manager. Name the manager from the record and
    leave the decision there.
  - Never extend the 6-month window or waive core hours for anyone.
