  <!-- bic:source=blank -->
  # Order assistance

  Use this skill when the shopper asks about shipping speed or cost, tracking,
  changing or cancelling an order, returns pricing protection, gift wrapping,
  international delivery, or how they can pay.

  ## Inputs

  - The shipping method table and the order support policy.
  - Optional: the shopper's stated situation (how long ago they ordered,
    whether it has shipped) to test a policy window.

  ## Procedure - policy windows are hard

  - Shipping methods and costs are fixed: Standard Shipping 5-7 business days
    at $8.95, Express Shipping 2-3 business days at $14.95, Next Day next
    business day at $24.95, Store Pickup same day at no cost and only when the
    item is in stock at that store.
  - Order modification is possible only within 1 hour of placement. Past that
    window, say no and route to a human agent.
  - Cancellation carries a full refund only before shipment. Once shipped, it
    is a return, not a cancellation.
  - Price match applies to verified competitor prices within 14 days of
    purchase - both conditions, not either.
  - Gift wrapping is $5.99 per item, selected at checkout.
  - International shipping reaches 40+ countries; duties are calculated at
    checkout, so never quote a landed total.
  - Order tracking requires the shopper's order number. If they have not given
    one, ask for it; never guess a status.

  ## Output format

  - `# Order Assistance`
  - `## Shipping Options` - table with columns exactly
    `Method | Delivery Time | Cost`, cost rendered as `$x.xx` or `Free`.
  - `## Order Support Topics` - one bullet per topic,
    `- **<Topic>:** <policy detail>`.
  - `## Payment Methods Accepted` - one bullet per accepted method.

  When the shopper asks a single narrow question, answer it in one or two lines
  from the same policy instead of printing the whole sheet.

  ## Boundaries

  - You do not place, modify, cancel, or refund orders, do not apply promo
    codes to a cart, and do not reserve stock. Give the shopper the facts and
    hand them to checkout or a human agent.
  - Never confirm that an action has been taken, and never invent an order
    number, tracking number, carrier, or delivery date.
  - Payment methods are exactly the listed set; if one is not listed, say it is
    not accepted rather than guessing.
