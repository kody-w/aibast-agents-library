  <!-- bic:source=blank -->
  # Incentive optimization

  Use this skill when the user asks what discount or offer to put in front of a
  cart, which incentive converts best, what an offer costs in margin, or asks
  for the incentive recommendation on a specific CART- id.

  ## Inputs

  - The incentive catalog and the abandoned cart records.
  - Optional: a single CART- id, or a segment.

  ## Eligibility — hard gate, never waived

  A cart whose `recovery_status` is `unrecoverable` gets no incentive
  recommendation and is skipped entirely. There is no contact channel, so there
  is nothing to attach an offer to. Say that, rather than proposing an
  alternative channel.

  ## The selection rule — apply it, do not judge it

  Evaluate in this exact order and stop at the first match:

  1. `segment == "high_value"` AND `cart_value > 500` -> **percent_off_10**
     (10% off cart total)
  2. `segment == "loyal_shopper"` -> **free_shipping** (free standard shipping)
  3. `segment == "new_visitor"` -> **percent_off_15** (15% off cart total)
  4. otherwise -> **dollar_off_20** ($20 off orders over $150)

  Note that clause 1 has two conditions: a high_value customer with a cart at
  or below $500 falls through to clause 4. Never upgrade a cart to a richer
  incentive because it looks valuable, and never downgrade one to protect
  margin.

  ## Net recovery value — compute it

  `net_recovery_value = cart_value * (1 - cost_margin_impact / 100)`

  Margin impacts from the catalog: percent_off_10 = 10.0%, percent_off_15 =
  15.0%, free_shipping = 5.5%, dollar_off_20 = 8.0%, gift_with_purchase = 6.0%.

  Worked from the current records:

  - CART-20001, Loyal Shopper, $284.98 -> free shipping ->
    284.98 * (1 - 0.055) = **$269.31**, expected lift +28.0%
  - CART-20002, New Visitor, $299.97 -> 15% off ->
    299.97 * (1 - 0.15) = **$254.97**, expected lift +48.0%
  - CART-20003, High Value, $1,779.96 -> 10% off ->
    1779.96 * (1 - 0.10) = **$1,601.96**, expected lift +35.0%

  Conversion lift is the catalog's expected lift for that incentive. It is not
  a guaranteed outcome and must not be multiplied into a revenue promise.

  ## Output format

  - `## Available Incentives` — a table with exactly these columns:
    `Incentive | Description | Margin Impact | Conversion Lift`, lift rendered
    with a leading `+`.
  - `## Recommended Incentives by Cart` — for each recoverable cart, a
    `### CART-xxxxx: <customer> ($N,NNN.NN)` heading followed by bullets:
    `**Segment:**`, `**Recommended:**` (the incentive description),
    `**Expected Lift:**`, `**Net Recovery Value:**`.

  ## Edge cases

  - CART-20004 is unrecoverable and is skipped — no heading, no recommendation.
  - dollar_off_20 is defined as "$20 off orders over $150". If it is the rule's
    output for a cart at or below $150, flag that the offer's own threshold
    would not be met and escalate rather than substituting another incentive.
  - Recommendation only. Never say a code has been issued, applied, or sent.
