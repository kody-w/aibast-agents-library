<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Agent title lozenge</title>
<!--
  The gradient title lozenge the professional recordings lay over their opening
  b-roll, rendered for OUR agent so it can be composited over theirs on the base
  track. Transparent outside the pill, so only the lozenge lands.

  Sized and placed by align.html; this file only draws it.
-->
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:transparent;overflow:hidden}
body{display:flex;align-items:center;justify-content:center;
  font-family:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",sans-serif}
.pill{
  /* Pixel-sampled from the reference lozenge along its own axis: coral pink
     through magenta and violet into periwinkle, running slightly downhill. */
  background:linear-gradient(100deg,
    #f06e84 0%, #e66698 18%, #d361af 36%, #c458c8 54%,
    #a86dda 72%, #8a7ce7 90%, #7c82ee 100%);
  border-radius:9.5vh;
  padding:5vh 8.5%;
  width:100%;height:100%;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 1.4vh 3.6vh rgba(0,0,0,.18);
}
.pill h1{
  color:#fff;text-align:center;font-weight:700;letter-spacing:-.005em;
  line-height:1.06;font-size:30vh;
  text-shadow:0 .3vh .8vh rgba(0,0,0,.13);
}

</style>
</head>
<body>
  <div class="pill"><h1 id="t">Agent</h1></div>
<script>
function qs(n){var m=new RegExp("[?&]"+n+"=([^&]*)").exec(location.search);
  return m?decodeURIComponent(m[1].replace(/\+/g," ")):"";}
var ref=qs("agent")||qs("skill");
var kind=qs("skill")?"skill":"agent";
var slug=ref.split("/").pop();
var el=document.getElementById("t");

function present(name){
  // The recordings title the SOLUTION, not the code artifact: "Contract Risk
  // Review Agent", not "contract-risk-review". Always ends in "Agent".
  var n=String(name||slug).replace(/[-_]+/g," ").trim();
  n=n.replace(/\b\w/g,function(c){return c.toUpperCase();});
  if(!/\bagent$/i.test(n)) n+=" Agent";
  return n;
}
el.textContent=present(slug);

fetch("media/walkthroughs/"+kind+"-"+slug+".json")
  .then(function(r){return r.ok?r.json():null;})
  .then(function(d){
    if(d && d.subject && d.subject.display_name){
      el.textContent=present(d.subject.display_name);
    }
    // The reference wraps NATURALLY inside the pill's padding — "Account
    // Intelligence / Agent", not a forced halfway split. Let the box do it.
    window.__ready=true;
  })
  .catch(function(){ window.__ready=true; })
  .then(fit);

// The reference sets its title to fill the pill on two balanced lines. A fixed
// font size cannot do that for 183 different agent names — "Account
// Intelligence Agent" broke as "Account / Intelligence Agent" where the
// reference reads "Account Intelligence / Agent". So fit it: find the largest
// size that still lays out in at most two lines inside the padding, and let
// the natural wrap land where it lands.
function layout(){
  // The reference always breaks before the trailing "Agent" when the name runs
  // to three or more words — "Account Intelligence / Agent". Relying on natural
  // wrap made that depend on the font's width, and the face the reference uses
  // is not installed here, so the break landed a word early every time. State
  // the rule instead of inferring it from metrics.
  var w=el.textContent.trim().split(/\s+/);
  el.innerHTML = w.length>=3
    ? w.slice(0,-1).join(" ")+"<br>"+w[w.length-1]
    : w.join(" ");
}

function fit(){
  layout();
  var pill=document.querySelector(".pill");
  var avail=pill.clientHeight-2*parseFloat(getComputedStyle(pill).paddingTop);
  var lo=18,hi=46,best=18;
  for(var i=0;i<12;i++){
    var mid=(lo+hi)/2;
    el.style.fontSize=mid+"vh";
    // Only the width matters now that the break is explicit: the largest size
    // at which the longest line still fits the padded box.
    if(el.scrollHeight<=avail && el.scrollWidth<=el.clientWidth+1){
      best=mid; lo=mid;
    } else { hi=mid; }
  }
  el.style.fontSize=best+"vh";
  window.__ready=true;
}
</script>
</body>
</html>
