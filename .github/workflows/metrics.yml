# AIBAST RAR ratings refresh — the approved cat-agent-skills pattern:
# reconcile canonical per-agent Discussions, harvest positive reactions into
# rar/ratings.json, and refresh the other GitHub-native snapshots daily.
# This generated-data bot commit is the sanctioned exception to the
# no-direct-push rule (CLAUDE.md).
name: metrics
on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"
permissions:
  contents: read
# A manual run must not race the nightly one into the same commit.
concurrency:
  group: metrics
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      discussions: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Reconcile AIBAST rating discussions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/create_discussions.py
      - name: Fetch ratings snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/fetch_ratings.py
      - name: Fetch release download counts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/fetch_release_downloads.py
      - name: Community snapshot (adoption, conversations, in-the-wild)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/fetch_community.py
      - name: Accumulate traffic history (needs TRAFFIC_TOKEN secret; skips without)
        env:
          TRAFFIC_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
        run: python tools/fetch_traffic.py
      - name: Commit if changed
        run: |
          set -euo pipefail
          if git diff --quiet -- rar/discussions.json rar/ratings.json rar/downloads.json rar/traffic.json rar/community.json; then
            echo "no rating movement — nothing to commit"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add rar/discussions.json rar/ratings.json rar/downloads.json rar/traffic.json rar/community.json
            git commit -m "chore(metrics): refresh discussions, ratings, downloads, traffic"
            for attempt in 1 2 3; do
              if git push; then exit 0; fi
              git pull --rebase --autostash origin main
            done
            echo "::error::could not push metrics after 3 attempts"
            exit 1
          fi
