# Publish per-agent assets on a release so downloads become measurable —
# GitHub counts release-asset downloads natively (fetch_release_downloads.py
# harvests them daily). Manual trigger: run when cutting a release.
name: release-assets
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to attach agent assets to"
        required: true
permissions:
  contents: write
jobs:
  attach:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Collect agent files
        run: |
          mkdir -p out
          python3 - <<'PY'
          import json, shutil, pathlib
          reg = json.loads(pathlib.Path("rar/registry.json").read_text())
          for a in reg["agents"]:
              src = pathlib.Path(a["_file"])
              slug = a["name"].split("/")[1]
              shutil.copy(src, f"out/{slug.replace('-', '_')}_agent.py")
          print("assets:", len(list(pathlib.Path('out').glob('*.py'))))
          PY
      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.tag }}" out/*.py --clobber
