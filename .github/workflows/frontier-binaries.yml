name: Frontier Binaries

on:
  pull_request:
    paths:
      - 'beta/**'
      - '.github/workflows/frontier-binaries.yml'
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Sign, attach, verify, and publish an existing draft release'
        required: true
        default: false
        type: boolean
      release_tag:
        description: 'Existing draft brainstem-beta-v* tag (required only when publishing)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: frontier-binaries-${{ inputs.publish_release && inputs.release_tag || github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  context:
    name: Validate packaging context
    runs-on: ubuntu-24.04
    outputs:
      commit: ${{ steps.context.outputs.commit }}
      release_id: ${{ steps.context.outputs.release_id }}
      release_mode: ${{ steps.context.outputs.release_mode }}
      first_binary_release: ${{ steps.context.outputs.first_binary_release }}
      previous_windows_asset_digest: ${{ steps.context.outputs.previous_windows_asset_digest }}
      previous_windows_asset_id: ${{ steps.context.outputs.previous_windows_asset_id }}
      previous_windows_asset_name: ${{ steps.context.outputs.previous_windows_asset_name }}
      previous_windows_release_tag: ${{ steps.context.outputs.previous_windows_release_tag }}
      tag: ${{ steps.context.outputs.tag }}
      tag_object: ${{ steps.context.outputs.tag_object }}
      version: ${{ steps.context.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_tag || github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.19.0'

      - name: Validate source and optional draft release
        id: context
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_RELEASE: ${{ inputs.publish_release || false }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          version="$(node -p 'require("./beta/package.json").version')"
          test "$version" = "$(tr -d '[:space:]' < beta/VERSION)"
          test "$version" = "$(node -p 'require("./beta/package-lock.json").version')"
          test "$version" = "$(node -p 'require("./beta/package-lock.json").packages[""].version')"
          commit="$(git rev-parse HEAD)"
          release_mode=false
          release_id=
          tag=
          tag_object=
          first_binary_release=false
          previous_windows_asset_digest=
          previous_windows_asset_id=
          previous_windows_asset_name=
          previous_windows_release_tag=

          if [ "$PUBLISH_RELEASE" = true ]; then
            test "$GITHUB_EVENT_NAME" = workflow_dispatch
            tag="${RELEASE_TAG:?release_tag is required when publish_release is true}"
            expected_tag="brainstem-beta-v$version"
            if [ "$tag" != "$expected_tag" ]; then
              echo "::error::release_tag must be exactly $expected_tag for this source tree"
              exit 1
            fi
            if ! [[ "$tag" =~ ^brainstem-beta-v[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$ ]]; then
              echo "::error::release_tag is not a supported Frontier beta tag"
              exit 1
            fi
            test "$GITHUB_REF" = "refs/tags/$tag"
            if [ "$GITHUB_REPOSITORY" != microsoft/aibast-agents-library ]; then
              echo "::error::release package authority must be microsoft/aibast-agents-library"
              exit 1
            fi
            release_policy_failed=0
            if ! node beta/scripts/toolchain-policy.mjs \
              --require-publication; then
              release_policy_failed=1
            fi
            if ! node beta/scripts/native-media-gate.mjs \
              --policy beta/build/native-media-policy.json \
              --require-publication; then
              release_policy_failed=1
            fi
            if ! node -e '
              const policy = require("./beta/build/windows-signing-policy.json");
              if (policy.publication_enabled !== true ||
                  policy.backend_approval !== "approved" ||
                  policy.approved_backend_schema !==
                    policy.current_backend_schema ||
                  policy.protected_signer_validation !== "approved" ||
                  policy.client_secret_allowed !== false ||
                  policy.required_environment !== "windows-production" ||
                  policy.required_profile_type !== "PublicTrust") {
                console.error(policy.publication_blocker ||
                  "Windows signing policy is not approved.");
                process.exit(1);
              }
            '; then
              release_policy_failed=1
            fi
            if ! node -e '
              const policy = require("./beta/build/package-bootstrap-policy.json");
              if (policy.publication_enabled !== true ||
                  policy.canonical_repository !==
                    "microsoft/aibast-agents-library") {
                console.error((policy.publication_blockers || []).join(" | ") ||
                  "Package bootstrap policy is not approved.");
                process.exit(1);
              }
            '; then
              release_policy_failed=1
            fi
            test "$release_policy_failed" = 0

            if [ "$(git cat-file -t "refs/tags/$tag")" != tag ]; then
              echo "::error::Frontier release tags must be annotated tags"
              exit 1
            fi
            tag_commit="$(git rev-parse "$tag^{commit}")"
            test "$tag_commit" = "$commit"
            tag_object="$(git rev-parse "refs/tags/$tag")"
            remote_tag_object="$(
              git ls-remote --exit-code origin "refs/tags/$tag" | awk 'NR == 1 { print $1 }'
            )"
            remote_tag_commit="$(
              git ls-remote --exit-code origin "refs/tags/$tag^{}" |
                awk 'NR == 1 { print $1 }'
            )"
            test "$remote_tag_object" = "$tag_object"
            test "$remote_tag_commit" = "$commit"

            all_releases="$(
              gh api -H "X-GitHub-Api-Version: 2026-03-10" \
                "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
                --paginate --slurp |
                jq -c '[.[][]]'
            )"
            releases="$(jq -c --arg tag "$tag" \
              '[.[] | select(.tag_name == $tag)]' <<<"$all_releases")"
            test "$(jq 'length' <<<"$releases")" = 1
            release="$(jq -c '.[0]' <<<"$releases")"
            test "$(jq -r '.draft' <<<"$release")" = true
            test "$(jq -r '.prerelease' <<<"$release")" = true
            test "$(jq -r '.immutable // false' <<<"$release")" = false
            release_id="$(jq -r '.id' <<<"$release")"
            printf '%s' "$release" \
              > "$RUNNER_TEMP/frontier-initial-release.json"
            initial_release_fingerprint="$(
              node beta/scripts/release-race-guard.mjs \
                --fingerprint-file "$RUNNER_TEMP/frontier-initial-release.json"
            )"
            node beta/scripts/release-race-guard.mjs \
              --expected-tag "$tag" \
              --expected-tag-object "$tag_object" \
              --expected-commit "$commit" \
              --expected-release-id "$release_id" \
              --expected-release-fingerprint "$initial_release_fingerprint" \
              --actual-tag-object "$remote_tag_object" \
              --actual-commit "$remote_tag_commit" \
              --actual-release-file "$RUNNER_TEMP/frontier-initial-release.json"
            printf '%s\n' "$all_releases" \
              > "$RUNNER_TEMP/frontier-release-inventory.json"
            node beta/scripts/windows-upgrade-policy.mjs \
              --releases "$RUNNER_TEMP/frontier-release-inventory.json" \
              --current-tag "$tag" \
              --output "$RUNNER_TEMP/frontier-windows-upgrade.json"
            first_binary_release="$(
              jq -r '.firstBinaryRelease' \
                "$RUNNER_TEMP/frontier-windows-upgrade.json"
            )"
            previous_windows_asset_digest="$(
              jq -r '.previousAssetDigest // ""' \
                "$RUNNER_TEMP/frontier-windows-upgrade.json"
            )"
            previous_windows_asset_id="$(
              jq -r '.previousAssetId // ""' \
                "$RUNNER_TEMP/frontier-windows-upgrade.json"
            )"
            previous_windows_asset_name="$(
              jq -r '.previousAssetName // ""' \
                "$RUNNER_TEMP/frontier-windows-upgrade.json"
            )"
            previous_windows_release_tag="$(
              jq -r '.previousReleaseTag // ""' \
                "$RUNNER_TEMP/frontier-windows-upgrade.json"
            )"
            release_mode=true
          else
            if [ -n "${RELEASE_TAG:-}" ]; then
              echo "::error::release_tag must be empty for unsigned verification"
              exit 1
            fi
          fi

          {
            echo "commit=$commit"
            echo "first_binary_release=$first_binary_release"
            echo "previous_windows_asset_digest=$previous_windows_asset_digest"
            echo "previous_windows_asset_id=$previous_windows_asset_id"
            echo "previous_windows_asset_name=$previous_windows_asset_name"
            echo "previous_windows_release_tag=$previous_windows_release_tag"
            echo "release_id=$release_id"
            echo "release_mode=$release_mode"
            echo "tag=$tag"
            echo "tag_object=$tag_object"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Frontier binary context"
            echo
            echo "- mode: $([ "$release_mode" = true ] && echo signed-release || echo unsigned-verification)"
            echo "- version: \`$version\`"
            echo "- commit: \`$commit\`"
            if [ "$release_mode" = true ]; then
              echo "- existing draft release: \`$tag\` (id \`$release_id\`)"
              echo "- Windows upgrade baseline: \`$([ "$first_binary_release" = true ] && echo first-binary-release || echo "$previous_windows_release_tag")\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  verify-macos:
    name: Unsigned macOS ${{ matrix.arch }}
    needs: context
    if: needs.context.outputs.release_mode != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: macos-26-intel
          - arch: arm64
            runner: macos-26
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.context.outputs.commit }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: beta/package-lock.json

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Prepare Brainstem runtime for package smoke
        id: runtime
        run: |
          python -m pip install -q --disable-pip-version-check -r rapp_brainstem/requirements.txt
          echo "python=$(python -c 'import sys; print(sys.executable)')" >> "$GITHUB_OUTPUT"

      - name: Build native unsigned DMG
        working-directory: beta
        env:
          FRONTIER_SIGNING_MODE: unsigned
          FRONTIER_PACKAGE_BOOTSTRAP_MODE: ${{ (github.repository != 'microsoft/aibast-agents-library' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)) && 'staging' || 'development' }}
          FRONTIER_PACKAGE_SOURCE_REPOSITORY: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          FRONTIER_PACKAGE_APP_ID: ${{ (github.repository != 'microsoft/aibast-agents-library' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)) && vars.FRONTIER_STAGING_APP_ID || '' }}
          FRONTIER_PACKAGE_PRODUCT_NAME: ${{ (github.repository != 'microsoft/aibast-agents-library' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)) && vars.FRONTIER_STAGING_PRODUCT_NAME || '' }}
          TMPDIR: ${{ github.workspace }}/beta/release/.ci-tmp
        run: |
          set -euo pipefail
          mkdir -p "$TMPDIR"
          npm ci --no-audit --no-fund
          npm run "dist:mac:${{ matrix.arch }}"

      - name: Gate final unsigned DMG
        working-directory: beta
        env:
          VERSION: ${{ needs.context.outputs.version }}
        run: |
          set -euo pipefail
          artifact="release/RAPP-Brainstem-Frontier-${VERSION}-macos-${{ matrix.arch }}-unsigned.dmg"
          report="$artifact.gate.json"
          log="$artifact.gate.log"
          npm run package:gate -- \
            --platform macos \
            --arch "${{ matrix.arch }}" \
            --mode unsigned \
            --artifact "$artifact" \
            --scratch-dir "release/package-gate-macos-${{ matrix.arch }}-unsigned" \
            --brainstem-python "${{ steps.runtime.outputs.python }}" \
            --brainstem-source "$GITHUB_WORKSPACE/rapp_brainstem" \
            --report "$report" 2>&1 | tee "$log"
          cat > release/UNSIGNED-NOT-FOR-DISTRIBUTION.txt <<EOF
          This is report-only unsigned CI evidence, not a distributable package.
          Commit: ${{ needs.context.outputs.commit }}
          Platform: macOS ${{ matrix.arch }}
          EOF
          node scripts/unsigned-upload-gate.mjs \
            --path "$report" \
            --path "$log" \
            --path release/UNSIGNED-NOT-FOR-DISTRIBUTION.txt
          rm -f "$artifact" "$artifact.blockmap"
          rm -rf "release/${{ matrix.arch == 'arm64' && 'mac-arm64' || 'mac' }}"
          test ! -e "$artifact"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: UNSIGNED-REPORTS-frontier-macos-${{ matrix.arch }}-${{ needs.context.outputs.commit }}
          path: |
            beta/release/RAPP-Brainstem-Frontier-${{ needs.context.outputs.version }}-macos-${{ matrix.arch }}-unsigned.dmg.gate.json
            beta/release/RAPP-Brainstem-Frontier-${{ needs.context.outputs.version }}-macos-${{ matrix.arch }}-unsigned.dmg.gate.log
            beta/release/UNSIGNED-NOT-FOR-DISTRIBUTION.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  verify-windows:
    name: Unsigned Windows x64
    needs: context
    if: needs.context.outputs.release_mode != 'true'
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.context.outputs.commit }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: beta/package-lock.json

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Prepare Brainstem runtime for package smoke
        id: runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install -q --disable-pip-version-check -r rapp_brainstem/requirements.txt
          "python=$(python -c 'import sys; print(sys.executable)')" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Build native unsigned NSIS installer
        working-directory: beta
        shell: pwsh
        env:
          FRONTIER_SIGNING_MODE: unsigned
          FRONTIER_PACKAGE_BOOTSTRAP_MODE: ${{ (github.repository != 'microsoft/aibast-agents-library' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)) && 'staging' || 'development' }}
          FRONTIER_PACKAGE_SOURCE_REPOSITORY: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          FRONTIER_PACKAGE_APP_ID: ${{ (github.repository != 'microsoft/aibast-agents-library' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)) && vars.FRONTIER_STAGING_APP_ID || '' }}
          FRONTIER_PACKAGE_PRODUCT_NAME: ${{ (github.repository != 'microsoft/aibast-agents-library' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)) && vars.FRONTIER_STAGING_PRODUCT_NAME || '' }}
          TEMP: ${{ github.workspace }}\beta\release\.ci-tmp
          TMP: ${{ github.workspace }}\beta\release\.ci-tmp
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path $env:TEMP | Out-Null
          npm ci --no-audit --no-fund
          npm run dist:win:x64

      - name: Gate final unsigned NSIS installer
        working-directory: beta
        shell: pwsh
        env:
          VERSION: ${{ needs.context.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $artifact = "$env:GITHUB_WORKSPACE\beta\release\RAPP-Brainstem-Frontier-$env:VERSION-windows-x64-setup-unsigned.exe"
          $report = "$artifact.gate.json"
          $log = "$artifact.gate.log"
          Start-Transcript -Path $log -Force
          try {
            & "$env:GITHUB_WORKSPACE\beta\scripts\run-windows-package-gate-standard-user.ps1" `
              -NodePath (Get-Command node).Source `
              -Workspace $env:GITHUB_WORKSPACE `
              -Artifact $artifact `
              -AppDir "$env:GITHUB_WORKSPACE\beta\release\win-unpacked" `
              -ScratchDir "$env:GITHUB_WORKSPACE\beta\release\package-gate-windows-x64-unsigned" `
              -PythonPath '${{ steps.runtime.outputs.python }}' `
              -Mode unsigned `
              -Report $report
          } finally {
            Stop-Transcript
          }
          @"
          This is report-only unsigned CI evidence, not a distributable package.
          Commit: ${{ needs.context.outputs.commit }}
          Platform: Windows x64
          "@ | Set-Content -Path release/UNSIGNED-NOT-FOR-DISTRIBUTION.txt -Encoding utf8
          node scripts/unsigned-upload-gate.mjs `
            --path $report `
            --path $log `
            --path release/UNSIGNED-NOT-FOR-DISTRIBUTION.txt
          Remove-Item -LiteralPath $artifact -Force
          Remove-Item -LiteralPath "$artifact.blockmap" -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath release/win-unpacked -Recurse -Force
          if (Test-Path -LiteralPath $artifact) {
            throw 'Unsigned NSIS installer still exists before report upload'
          }

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: UNSIGNED-REPORTS-frontier-windows-x64-${{ needs.context.outputs.commit }}
          path: |
            beta/release/RAPP-Brainstem-Frontier-${{ needs.context.outputs.version }}-windows-x64-setup-unsigned.exe.gate.json
            beta/release/RAPP-Brainstem-Frontier-${{ needs.context.outputs.version }}-windows-x64-setup-unsigned.exe.gate.log
            beta/release/UNSIGNED-NOT-FOR-DISTRIBUTION.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  release-macos:
    name: Signed macOS ${{ matrix.arch }}
    needs: context
    if: needs.context.outputs.release_mode == 'true'
    environment: frontier-binary-release
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: macos-26-intel
            app_dir: mac
          - arch: arm64
            runner: macos-26
            app_dir: mac-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.context.outputs.commit }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: beta/package-lock.json

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Prepare Brainstem runtime for package smoke
        id: runtime
        run: |
          python -m pip install -q --disable-pip-version-check -r rapp_brainstem/requirements.txt
          echo "python=$(python -c 'import sys; print(sys.executable)')" >> "$GITHUB_OUTPUT"

      - name: Install, test, hash native media, and assert a clean tree
        working-directory: beta
        env:
          TMPDIR: ${{ github.workspace }}/beta/release/.ci-tmp
        run: |
          set -euo pipefail
          mkdir -p "$TMPDIR"
          npm ci --no-audit --no-fund
          npm run check
          npm test
          node scripts/native-media-preflight.mjs \
            --platform macos \
            --arch "${{ matrix.arch }}" \
            --output "release/native-media-preflight-macos-${{ matrix.arch }}.json"
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Materialize isolated Apple signing authority
        working-directory: beta
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          MACOS_SIGNING_IDENTITY: ${{ vars.MACOS_SIGNING_IDENTITY }}
          APPLE_API_KEY_ID: ${{ vars.APPLE_API_KEY_ID }}
        run: |
          set -euo pipefail
          : "${MACOS_CERTIFICATE_P12_BASE64:?MACOS_CERTIFICATE_P12_BASE64 is required}"
          : "${MACOS_CERTIFICATE_PASSWORD:?MACOS_CERTIFICATE_PASSWORD is required}"
          : "${MACOS_SIGNING_IDENTITY:?MACOS_SIGNING_IDENTITY is required}"
          : "${APPLE_API_KEY_ID:?APPLE_API_KEY_ID is required}"
          : "${APPLE_API_KEY_P8_BASE64:?APPLE_API_KEY_P8_BASE64 is required}"
          p12_path="$RUNNER_TEMP/frontier-signing-${{ matrix.arch }}.p12"
          key_path="$RUNNER_TEMP/frontier-notarization-${{ matrix.arch }}.p8"
          keychain="$RUNNER_TEMP/frontier-signing-${{ matrix.arch }}.keychain-db"
          keychain_password="$(openssl rand -hex 32)"
          echo "::add-mask::$keychain_password"
          node - "$p12_path" "$key_path" <<'NODE'
          const fs = require("node:fs");
          const [p12Path, keyPath] = process.argv.slice(2);
          const p12 = Buffer.from(
            process.env.MACOS_CERTIFICATE_P12_BASE64,
            "base64",
          );
          const apiKey = Buffer.from(
            process.env.APPLE_API_KEY_P8_BASE64,
            "base64",
          );
          if (p12.length < 128) {
            throw new Error("MACOS_CERTIFICATE_P12_BASE64 is empty or invalid.");
          }
          if (!apiKey.toString("utf8").includes("PRIVATE KEY")) {
            throw new Error("APPLE_API_KEY_P8_BASE64 is not an App Store Connect private key.");
          }
          fs.writeFileSync(p12Path, p12, { mode: 0o600 });
          fs.writeFileSync(keyPath, apiKey, { mode: 0o600 });
          NODE
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$p12_path" \
            -k "$keychain" \
            -P "$MACOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$keychain_password" \
            "$keychain"
          security find-identity -v -p codesigning "$keychain" |
            grep -F "$MACOS_SIGNING_IDENTITY"
          {
            echo "APPLE_API_KEY=$key_path"
            echo "CSC_KEYCHAIN=$keychain"
            echo "FRONTIER_SIGNING_P12=$p12_path"
            echo "FRONTIER_SIGNING_KEYCHAIN=$keychain"
          } >> "$GITHUB_ENV"

      - name: Build, Developer ID sign, and notarize native DMG
        working-directory: beta
        env:
          FRONTIER_SIGNING_MODE: signed
          FRONTIER_PACKAGE_BOOTSTRAP_MODE: release
          FRONTIER_PACKAGE_SOURCE_REPOSITORY: ${{ github.repository }}
          FRONTIER_PACKAGE_RELEASE_TAG: ${{ needs.context.outputs.tag }}
          TMPDIR: ${{ github.workspace }}/beta/release/.ci-tmp
          MACOS_SIGNING_IDENTITY: ${{ vars.MACOS_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APPLE_API_KEY_ID: ${{ vars.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ vars.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          test -z "${CSC_LINK:-}"
          test -z "${CSC_KEY_PASSWORD:-}"
          : "${CSC_KEYCHAIN:?CSC_KEYCHAIN is required}"
          : "${MACOS_SIGNING_IDENTITY:?MACOS_SIGNING_IDENTITY is required}"
          : "${APPLE_TEAM_ID:?APPLE_TEAM_ID is required}"
          : "${APPLE_API_KEY:?APPLE_API_KEY is required}"
          : "${APPLE_API_KEY_ID:?APPLE_API_KEY_ID is required}"
          : "${APPLE_API_ISSUER:?APPLE_API_ISSUER_ID is required}"
          npm run "dist:mac:${{ matrix.arch }}"

      - name: Remove Apple signing authority immediately
        if: always()
        run: |
          set -uo pipefail
          cleanup_failed=0
          keychain="$RUNNER_TEMP/frontier-signing-${{ matrix.arch }}.keychain-db"
          p12_path="$RUNNER_TEMP/frontier-signing-${{ matrix.arch }}.p12"
          key_path="$RUNNER_TEMP/frontier-notarization-${{ matrix.arch }}.p8"
          if [ -e "$keychain" ]; then
            security delete-keychain "$keychain" ||
              cleanup_failed=1
          fi
          rm -f "$p12_path" "$key_path" ||
            cleanup_failed=1
          if [ -e "$keychain" ]; then
            cleanup_failed=1
          fi
          if [ -e "$p12_path" ]; then
            cleanup_failed=1
          fi
          if [ -e "$key_path" ]; then
            cleanup_failed=1
          fi
          {
            echo "APPLE_API_KEY="
            echo "CSC_KEYCHAIN="
            echo "FRONTIER_SIGNING_P12="
            echo "FRONTIER_SIGNING_KEYCHAIN="
          } >> "$GITHUB_ENV"
          test "$cleanup_failed" = 0

      - name: Gate signed and notarized DMG
        id: package
        working-directory: beta
        env:
          VERSION: ${{ needs.context.outputs.version }}
          MACOS_SIGNING_IDENTITY: ${{ vars.MACOS_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          artifact="$GITHUB_WORKSPACE/beta/release/RAPP-Brainstem-Frontier-${VERSION}-macos-${{ matrix.arch }}.dmg"
          report="$artifact.gate.json"
          npm run package:gate -- \
            --platform macos \
            --arch "${{ matrix.arch }}" \
            --mode signed \
            --artifact "$artifact" \
            --app-dir "release/${{ matrix.app_dir }}/RAPP Brainstem Frontier.app" \
            --scratch-dir "release/package-gate-macos-${{ matrix.arch }}-signed" \
            --identity "$MACOS_SIGNING_IDENTITY" \
            --team-id "$APPLE_TEAM_ID" \
            --brainstem-python "${{ steps.runtime.outputs.python }}" \
            --brainstem-source "$GITHUB_WORKSPACE/rapp_brainstem" \
            --release-tag "${{ needs.context.outputs.tag }}" \
            --release-commit "${{ needs.context.outputs.commit }}" \
            --runtime-version-url \
              "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${{ needs.context.outputs.commit }}/rapp_brainstem/VERSION" \
            --report "$report"
          {
            echo "asset=$artifact"
            echo "report=$report"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontier-signed-macos-${{ matrix.arch }}
          path: |
            ${{ steps.package.outputs.asset }}
            ${{ steps.package.outputs.report }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  prepare-windows-release:
    name: Prepare validated Windows signing input
    needs: context
    if: needs.context.outputs.release_mode == 'true'
    permissions:
      contents: read
    runs-on: windows-2025
    outputs:
      bundle_sha256: ${{ steps.bundle.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.context.outputs.commit }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: beta/package-lock.json

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Install, test, hash native media, and assert a clean tree
        working-directory: beta
        shell: pwsh
        env:
          TEMP: ${{ github.workspace }}\beta\release\.ci-tmp
          TMP: ${{ github.workspace }}\beta\release\.ci-tmp
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path $env:TEMP | Out-Null
          npm ci --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw "npm ci failed with exit $LASTEXITCODE" }
          npm run check
          if ($LASTEXITCODE -ne 0) { throw "npm run check failed with exit $LASTEXITCODE" }
          npm test
          if ($LASTEXITCODE -ne 0) { throw "npm test failed with exit $LASTEXITCODE" }
          node scripts/native-media-preflight.mjs `
            --platform windows `
            --arch x64 `
            --output release/native-media-preflight-windows-x64.json
          if ($LASTEXITCODE -ne 0) {
            throw "native media preflight failed with exit $LASTEXITCODE"
          }
          git diff --quiet
          if ($LASTEXITCODE -ne 0) {
            throw 'Tracked files changed during Windows input validation'
          }
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            throw 'The index changed during Windows input validation'
          }
          if (git status --porcelain --untracked-files=no) {
            throw 'Tracked working tree is not clean before Windows build preparation'
          }

      - name: Build and gate unsigned pre-signing package
        working-directory: beta
        shell: pwsh
        env:
          FRONTIER_SIGNING_MODE: unsigned
          FRONTIER_PACKAGE_BOOTSTRAP_MODE: release
          FRONTIER_PACKAGE_SOURCE_REPOSITORY: ${{ github.repository }}
          FRONTIER_PACKAGE_RELEASE_TAG: ${{ needs.context.outputs.tag }}
          TEMP: ${{ github.workspace }}\beta\release\.ci-tmp
          TMP: ${{ github.workspace }}\beta\release\.ci-tmp
          ELECTRON_BUILDER_CACHE: ${{ github.workspace }}\beta\release\electron-builder-cache
          VERSION: ${{ needs.context.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          npm run dist:win:x64
          if ($LASTEXITCODE -ne 0) { throw "unsigned package build failed with exit $LASTEXITCODE" }
          $artifact = "$env:GITHUB_WORKSPACE\beta\release\RAPP-Brainstem-Frontier-$env:VERSION-windows-x64-setup-unsigned.exe"
          $report = "$artifact.gate.json"
          & "$env:GITHUB_WORKSPACE\beta\scripts\run-windows-package-gate-standard-user.ps1" `
            -NodePath (Get-Command node).Source `
            -Workspace $env:GITHUB_WORKSPACE `
            -Artifact $artifact `
            -AppDir "$env:GITHUB_WORKSPACE\beta\release\win-unpacked" `
            -ScratchDir "$env:GITHUB_WORKSPACE\beta\release\package-gate-windows-x64-presigning" `
            -PythonPath (Get-Command python).Source `
            -Mode unsigned `
            -Report $report
          Remove-Item -LiteralPath $artifact -Force
          Remove-Item -LiteralPath "$artifact.blockmap" -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath $report -Force
          if (-not (Test-Path -LiteralPath release/win-unpacked)) {
            throw 'Validated win-unpacked signing input is missing'
          }

      - name: Assemble immutable Windows signing input
        id: bundle
        shell: pwsh
        env:
          COMMIT: ${{ needs.context.outputs.commit }}
          VERSION: ${{ needs.context.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location "$env:GITHUB_WORKSPACE\beta"
          npm sbom --sbom-format=spdx |
            Set-Content -LiteralPath release/windows-dependencies.spdx.json -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw "npm sbom failed with exit $LASTEXITCODE" }

          $inputRoot = "$env:GITHUB_WORKSPACE\windows-signing-input"
          Remove-Item -LiteralPath $inputRoot -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path "$inputRoot\beta" | Out-Null
          robocopy.exe "$env:GITHUB_WORKSPACE\beta" "$inputRoot\beta" /E /R:2 /W:1 /NFL /NDL /NJH /NJS /NP
          if ($LASTEXITCODE -gt 7) { throw "robocopy failed with exit $LASTEXITCODE" }
          New-Item -ItemType Directory -Force -Path "$inputRoot\rapp_brainstem" | Out-Null
          Copy-Item -LiteralPath "$env:GITHUB_WORKSPACE\rapp_brainstem\VERSION" `
            -Destination "$inputRoot\rapp_brainstem\VERSION"
          New-Item -ItemType Directory -Force -Path "$inputRoot\tools" | Out-Null
          Copy-Item -LiteralPath (Get-Command node).Source `
            -Destination "$inputRoot\tools\node.exe"
          New-Item -ItemType Directory -Force -Path "$inputRoot\modules" | Out-Null
          Install-PackageProvider -Name NuGet -MinimumVersion 2.8.5.201 `
            -Force -Scope CurrentUser | Out-Null
          Save-Module -Name ArtifactSigning -RequiredVersion 0.1.8 `
            -Repository PSGallery -Path "$inputRoot\modules"
          & "$inputRoot\tools\node.exe" `
            "$inputRoot\beta\scripts\windows-signing-input.mjs" `
            --mode create `
            --root $inputRoot `
            --commit $env:COMMIT
          if ($LASTEXITCODE -ne 0) { throw 'signing input manifest creation failed' }

          $bundle = "$env:GITHUB_WORKSPACE\windows-signing-input.zip"
          Remove-Item -LiteralPath $bundle -Force -ErrorAction SilentlyContinue
          tar.exe -a -c -f $bundle -C $env:GITHUB_WORKSPACE windows-signing-input
          if ($LASTEXITCODE -ne 0) { throw "signing input archive failed with exit $LASTEXITCODE" }
          $sha = (Get-FileHash -LiteralPath $bundle -Algorithm SHA256).Hash.ToLowerInvariant()
          "sha256=$sha" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontier-windows-signing-input
          path: windows-signing-input.zip
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

  release-windows:
    name: Sign validated Windows input with isolated OIDC
    needs: [context, prepare-windows-release]
    if: needs.context.outputs.release_mode == 'true'
    environment: windows-production
    permissions:
      contents: read
      id-token: write
    runs-on: windows-2025
    outputs:
      signed_bundle_sha256: ${{ steps.seal.outputs.sha256 }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: frontier-windows-signing-input
          path: signing-download

      - name: Verify immutable signing input before OIDC use
        id: input
        shell: pwsh
        env:
          EXPECTED_SHA256: ${{ needs.prepare-windows-release.outputs.bundle_sha256 }}
          COMMIT: ${{ needs.context.outputs.commit }}
        run: |
          $ErrorActionPreference = 'Stop'
          $bundle = "$env:GITHUB_WORKSPACE\signing-download\windows-signing-input.zip"
          if ($env:EXPECTED_SHA256 -notmatch '^[0-9a-f]{64}$') {
            throw 'Expected Windows signing input digest is invalid'
          }
          $actual = (Get-FileHash -LiteralPath $bundle -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $env:EXPECTED_SHA256) {
            throw 'Windows signing input archive digest mismatch'
          }
          $extractRoot = "$env:GITHUB_WORKSPACE\signer"
          New-Item -ItemType Directory -Force -Path $extractRoot | Out-Null
          tar.exe -xf $bundle -C $extractRoot
          if ($LASTEXITCODE -ne 0) { throw "signing input extraction failed with exit $LASTEXITCODE" }
          $inputRoot = "$extractRoot\windows-signing-input"
          & "$inputRoot\tools\node.exe" `
            "$inputRoot\beta\scripts\windows-signing-input.mjs" `
            --mode verify `
            --root $inputRoot `
            --commit $env:COMMIT
          if ($LASTEXITCODE -ne 0) { throw 'Windows signing input verification failed' }
          "root=$inputRoot" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      # The workload identity has only Artifact Signing Certificate Profile Signer
      # at the selected certificate-profile scope.
      - name: Validate protected Artifact Signing configuration
        shell: pwsh
        env:
          WINDOWS_SIGNING_SUBJECT: ${{ vars.WINDOWS_SIGNING_SUBJECT }}
          AZURE_ARTIFACT_SIGNING_ENDPOINT: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          AZURE_ARTIFACT_SIGNING_ACCOUNT_NAME: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT_NAME }}
          AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE_NAME: ${{ vars.AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE_NAME }}
          AZURE_ARTIFACT_SIGNING_PROFILE_TYPE: ${{ vars.AZURE_ARTIFACT_SIGNING_PROFILE_TYPE }}
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($name in @(
            'WINDOWS_SIGNING_SUBJECT',
            'AZURE_ARTIFACT_SIGNING_ENDPOINT',
            'AZURE_ARTIFACT_SIGNING_ACCOUNT_NAME',
            'AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE_NAME',
            'AZURE_ARTIFACT_SIGNING_PROFILE_TYPE'
          )) {
            if (-not [Environment]::GetEnvironmentVariable($name)) {
              throw "$name is required"
            }
          }
          if ($env:AZURE_ARTIFACT_SIGNING_PROFILE_TYPE -ne 'PublicTrust') {
            throw 'AZURE_ARTIFACT_SIGNING_PROFILE_TYPE must be PublicTrust'
          }

      - name: Azure login with workload identity
        uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3.0.2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Sign validated app, uninstaller, and NSIS package
        shell: pwsh
        env:
          FRONTIER_ARTIFACT_SIGNING_MODULE_ROOT: ${{ steps.input.outputs.root }}\modules
          ELECTRON_BUILDER_CACHE: ${{ steps.input.outputs.root }}\beta\release\electron-builder-cache
          AZURE_ARTIFACT_SIGNING_ENDPOINT: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          AZURE_ARTIFACT_SIGNING_ACCOUNT_NAME: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT_NAME }}
          AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE_NAME: ${{ vars.AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE_NAME }}
          WINDOWS_SIGNING_SUBJECT: ${{ vars.WINDOWS_SIGNING_SUBJECT }}
        run: |
          $ErrorActionPreference = 'Stop'
          $root = '${{ steps.input.outputs.root }}'
          & "$root\tools\node.exe" `
            "$root\beta\scripts\sign-validated-windows-input.mjs"
          if ($LASTEXITCODE -ne 0) { throw "isolated signing failed with exit $LASTEXITCODE" }

      - name: Clear Azure CLI session immediately after signing
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          az logout 2>$null
          az account clear 2>$null
          $account = az account show 2>$null
          if ($LASTEXITCODE -eq 0 -or $account) {
            throw 'Azure CLI signing session remained active after cleanup'
          }

      - name: Seal signed workspace after OIDC cleanup
        id: seal
        shell: pwsh
        env:
          COMMIT: ${{ needs.context.outputs.commit }}
        run: |
          $ErrorActionPreference = 'Stop'
          $root = '${{ steps.input.outputs.root }}'
          & "$root\tools\node.exe" `
            "$root\beta\scripts\windows-signing-input.mjs" `
            --mode create `
            --root $root `
            --commit $env:COMMIT
          if ($LASTEXITCODE -ne 0) { throw 'signed workspace manifest creation failed' }
          $bundle = "$env:GITHUB_WORKSPACE\windows-signed-workspace.zip"
          tar.exe -a -c -f $bundle -C (Split-Path $root -Parent) (Split-Path $root -Leaf)
          if ($LASTEXITCODE -ne 0) { throw "signed workspace archive failed with exit $LASTEXITCODE" }
          $sha = (Get-FileHash -LiteralPath $bundle -Algorithm SHA256).Hash.ToLowerInvariant()
          "sha256=$sha" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontier-signed-windows-workspace
          path: windows-signed-workspace.zip
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

  verify-windows-release:
    name: Verify signed Windows package without OIDC
    needs: [context, prepare-windows-release, release-windows]
    if: needs.context.outputs.release_mode == 'true'
    environment: frontier-binary-release
    permissions:
      contents: read
    runs-on: windows-2025
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: frontier-signed-windows-workspace
          path: signed-download

      - name: Verify signed workspace input
        id: workspace
        shell: pwsh
        env:
          EXPECTED_SHA256: ${{ needs.release-windows.outputs.signed_bundle_sha256 }}
          COMMIT: ${{ needs.context.outputs.commit }}
        run: |
          $ErrorActionPreference = 'Stop'
          $bundle = "$env:GITHUB_WORKSPACE\signed-download\windows-signed-workspace.zip"
          if ($env:EXPECTED_SHA256 -notmatch '^[0-9a-f]{64}$') {
            throw 'Expected signed Windows workspace digest is invalid'
          }
          $actual = (Get-FileHash -LiteralPath $bundle -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $env:EXPECTED_SHA256) {
            throw 'Signed Windows workspace digest mismatch'
          }
          $extractRoot = "$env:GITHUB_WORKSPACE\verified"
          New-Item -ItemType Directory -Force -Path $extractRoot | Out-Null
          tar.exe -xf $bundle -C $extractRoot
          if ($LASTEXITCODE -ne 0) { throw "signed workspace extraction failed with exit $LASTEXITCODE" }
          $root = "$extractRoot\windows-signing-input"
          & "$root\tools\node.exe" `
            "$root\beta\scripts\windows-signing-input.mjs" `
            --mode verify `
            --root $root `
            --commit $env:COMMIT
          if ($LASTEXITCODE -ne 0) { throw 'Signed Windows workspace verification failed' }
          "root=$root" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Download immutable N-1 Windows installer
        id: previous
        if: needs.context.outputs.first_binary_release != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS_ASSET_ID: ${{ needs.context.outputs.previous_windows_asset_id }}
          PREVIOUS_ASSET_NAME: ${{ needs.context.outputs.previous_windows_asset_name }}
          PREVIOUS_ASSET_DIGEST: ${{ needs.context.outputs.previous_windows_asset_digest }}
        run: |
          $ErrorActionPreference = 'Stop'
          $root = '${{ steps.workspace.outputs.root }}'
          if ($env:PREVIOUS_ASSET_ID -notmatch '^[1-9][0-9]*$') {
            throw 'Previous Windows asset ID is invalid'
          }
          if ($env:PREVIOUS_ASSET_NAME -notmatch '^RAPP-Brainstem-Frontier-.+-windows-x64-setup\.exe$') {
            throw 'Previous Windows asset name is invalid'
          }
          if ($env:PREVIOUS_ASSET_DIGEST -notmatch '^sha256:[0-9a-f]{64}$') {
            throw 'Previous Windows asset digest is invalid'
          }
          $previousDirectory = "$root\beta\release\previous"
          New-Item -ItemType Directory -Force -Path $previousDirectory | Out-Null
          $target = Join-Path $previousDirectory 'n-minus-one-windows-x64-setup.exe'
          curl.exe --fail --location --silent --show-error `
            -H "Authorization: Bearer $env:GH_TOKEN" `
            -H 'Accept: application/octet-stream' `
            -H 'X-GitHub-Api-Version: 2026-03-10' `
            "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/assets/$env:PREVIOUS_ASSET_ID" `
            --output $target
          if ($LASTEXITCODE -ne 0) {
            throw "Previous installer download failed with exit $LASTEXITCODE"
          }
          $actual = (Get-FileHash -LiteralPath $target -Algorithm SHA256).Hash.ToLowerInvariant()
          if ("sha256:$actual" -ne $env:PREVIOUS_ASSET_DIGEST) {
            throw 'Previous Windows installer digest mismatch'
          }
          "path=$target" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Gate signed NSIS package and complete lifecycle
        id: package
        shell: pwsh
        env:
          VERSION: ${{ needs.context.outputs.version }}
          WINDOWS_SIGNING_SUBJECT: ${{ vars.WINDOWS_SIGNING_SUBJECT }}
          AZURE_ARTIFACT_SIGNING_ENDPOINT: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          AZURE_ARTIFACT_SIGNING_ACCOUNT_NAME: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT_NAME }}
          AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE_NAME: ${{ vars.AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE_NAME }}
          AZURE_ARTIFACT_SIGNING_PROFILE_TYPE: ${{ vars.AZURE_ARTIFACT_SIGNING_PROFILE_TYPE }}
        run: |
          $ErrorActionPreference = 'Stop'
          $root = '${{ steps.workspace.outputs.root }}'
          $artifact = "$root\beta\release\signed\RAPP-Brainstem-Frontier-$env:VERSION-windows-x64-setup.exe"
          $report = "$artifact.gate.json"
          $runtimeVersionUrl = "https://raw.githubusercontent.com/$env:GITHUB_REPOSITORY/${{ needs.context.outputs.commit }}/rapp_brainstem/VERSION"
          $parameters = @{
            NodePath = "$root\tools\node.exe"
            Workspace = $root
            Artifact = $artifact
            AppDir = "$root\beta\release\win-unpacked"
            ScratchDir = "$root\beta\release\package-gate-windows-x64-signed"
            PythonPath = (Get-Command python).Source
            Mode = 'signed'
            ExpectedPublisher = $env:WINDOWS_SIGNING_SUBJECT
            ReleaseTag = '${{ needs.context.outputs.tag }}'
            ReleaseCommit = '${{ needs.context.outputs.commit }}'
            RuntimeVersionUrl = $runtimeVersionUrl
            Report = $report
          }
          if ('${{ needs.context.outputs.first_binary_release }}' -eq 'true') {
            $parameters.FirstBinaryRelease = $true
          } else {
            $parameters.PreviousInstaller = '${{ steps.previous.outputs.path }}'
            $parameters.PreviousReleaseTag = '${{ needs.context.outputs.previous_windows_release_tag }}'
          }
          & "$root\beta\scripts\run-windows-package-gate-standard-user.ps1" @parameters
          Copy-Item -LiteralPath "$root\beta\release\windows-dependencies.spdx.json" `
            -Destination "$artifact.spdx.json"
          @(
            "asset=$artifact",
            "report=$report",
            "sbom=$artifact.spdx.json"
          ) | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontier-verified-windows-x64
          path: |
            ${{ steps.package.outputs.asset }}
            ${{ steps.package.outputs.report }}
            ${{ steps.package.outputs.sbom }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  stage-release:
    name: Stage and verify draft release assets
    needs: [context, release-macos, verify-windows-release]
    if: needs.context.outputs.release_mode == 'true'
    environment: frontier-binary-release
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    outputs:
      release_fingerprint: ${{ steps.final-draft.outputs.release_fingerprint }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.context.outputs.commit }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.19.0'

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: frontier-signed-macos-*
          path: release-assets
          merge-multiple: true

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: frontier-verified-windows-x64
          path: release-assets

      - name: Attest macOS ARM64 release asset
        id: attest-macos-arm64
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release-assets/RAPP-Brainstem-Frontier-${{ needs.context.outputs.version }}-macos-arm64.dmg

      - name: Attest macOS x64 release asset
        id: attest-macos-x64
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release-assets/RAPP-Brainstem-Frontier-${{ needs.context.outputs.version }}-macos-x64.dmg

      - name: Attest Windows x64 release asset
        id: attest-windows-x64
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release-assets/RAPP-Brainstem-Frontier-${{ needs.context.outputs.version }}-windows-x64-setup.exe

      - name: Preserve binary provenance bundles
        env:
          VERSION: ${{ needs.context.outputs.version }}
          MACOS_ARM64_BUNDLE: ${{ steps.attest-macos-arm64.outputs.bundle-path }}
          MACOS_X64_BUNDLE: ${{ steps.attest-macos-x64.outputs.bundle-path }}
          WINDOWS_X64_BUNDLE: ${{ steps.attest-windows-x64.outputs.bundle-path }}
        run: |
          cp "$MACOS_ARM64_BUNDLE" \
            "release-assets/RAPP-Brainstem-Frontier-${VERSION}-macos-arm64.dmg.sigstore.json"
          cp "$MACOS_X64_BUNDLE" \
            "release-assets/RAPP-Brainstem-Frontier-${VERSION}-macos-x64.dmg.sigstore.json"
          cp "$WINDOWS_X64_BUNDLE" \
            "release-assets/RAPP-Brainstem-Frontier-${VERSION}-windows-x64-setup.exe.sigstore.json"

      - name: Require complete binary, gate, and provenance matrix
        env:
          VERSION: ${{ needs.context.outputs.version }}
        run: |
          set -euo pipefail
          cd release-assets
          expected=(
            "RAPP-Brainstem-Frontier-${VERSION}-macos-arm64.dmg"
            "RAPP-Brainstem-Frontier-${VERSION}-macos-x64.dmg"
            "RAPP-Brainstem-Frontier-${VERSION}-windows-x64-setup.exe"
          )
          for asset in "${expected[@]}"; do
            test -s "$asset"
            test -s "$asset.sigstore.json"
            test -s "$asset.gate.json"
          done
          test -s \
            "RAPP-Brainstem-Frontier-${VERSION}-windows-x64-setup.exe.spdx.json"
          test "$(find . -maxdepth 1 -type f \( -name '*.dmg' -o -name '*.exe' \) | wc -l | tr -d ' ')" = 3
          test "$(find . -maxdepth 1 -type f | wc -l | tr -d ' ')" = 10
          sha256sum "${expected[@]}" > "$RUNNER_TEMP/FRONTIER_BINARY_SHA256SUMS"

      - name: Write binary allowlist manifest
        id: manifest
        env:
          FRONTIER_RELEASE_TAG: ${{ needs.context.outputs.tag }}
          FRONTIER_RELEASE_VERSION: ${{ needs.context.outputs.version }}
          FRONTIER_RELEASE_COMMIT: ${{ needs.context.outputs.commit }}
          FRONTIER_GATE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          MACOS_SIGNING_IDENTITY: ${{ vars.MACOS_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          WINDOWS_SIGNING_SUBJECT: ${{ vars.WINDOWS_SIGNING_SUBJECT }}
          AZURE_ARTIFACT_SIGNING_ENDPOINT: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          AZURE_ARTIFACT_SIGNING_ACCOUNT_NAME: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT_NAME }}
          AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE_NAME: ${{ vars.AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE_NAME }}
          AZURE_ARTIFACT_SIGNING_PROFILE_TYPE: ${{ vars.AZURE_ARTIFACT_SIGNING_PROFILE_TYPE }}
        run: |
          manifest="$GITHUB_WORKSPACE/release-assets/RAPP-Brainstem-Frontier-${FRONTIER_RELEASE_VERSION}-binary-manifest.json"
          node beta/scripts/release-manifest.mjs \
            --artifact-dir release-assets \
            --checksums "$RUNNER_TEMP/FRONTIER_BINARY_SHA256SUMS" \
            --output "$manifest"
          echo "path=$manifest" >> "$GITHUB_OUTPUT"

      - name: Attest binary allowlist manifest
        id: manifest-attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.manifest.outputs.path }}

      - name: Preserve manifest signature and hash release evidence
        env:
          MANIFEST: ${{ steps.manifest.outputs.path }}
          BUNDLE: ${{ steps.manifest-attest.outputs.bundle-path }}
          VERSION: ${{ needs.context.outputs.version }}
        run: |
          set -euo pipefail
          cp "$BUNDLE" "$MANIFEST.sigstore.json"
          cd release-assets
          sha256sum \
            "RAPP-Brainstem-Frontier-${VERSION}-macos-arm64.dmg" \
            "RAPP-Brainstem-Frontier-${VERSION}-macos-arm64.dmg.gate.json" \
            "RAPP-Brainstem-Frontier-${VERSION}-macos-arm64.dmg.sigstore.json" \
            "RAPP-Brainstem-Frontier-${VERSION}-macos-x64.dmg" \
            "RAPP-Brainstem-Frontier-${VERSION}-macos-x64.dmg.gate.json" \
            "RAPP-Brainstem-Frontier-${VERSION}-macos-x64.dmg.sigstore.json" \
            "RAPP-Brainstem-Frontier-${VERSION}-windows-x64-setup.exe" \
            "RAPP-Brainstem-Frontier-${VERSION}-windows-x64-setup.exe.gate.json" \
            "RAPP-Brainstem-Frontier-${VERSION}-windows-x64-setup.exe.sigstore.json" \
            "RAPP-Brainstem-Frontier-${VERSION}-windows-x64-setup.exe.spdx.json" \
            "RAPP-Brainstem-Frontier-${VERSION}-binary-manifest.json" \
            "RAPP-Brainstem-Frontier-${VERSION}-binary-manifest.json.sigstore.json" \
            > SHA256SUMS

      - name: Bind signed manifest into draft release notes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.context.outputs.release_id }}
          MANIFEST: ${{ steps.manifest.outputs.path }}
        run: |
          set -euo pipefail
          gh api -H "X-GitHub-Api-Version: 2026-03-10" \
            "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            --jq '.body // ""' > "$RUNNER_TEMP/frontier-release-body.md"
          node beta/scripts/fence-release-manifest.mjs \
            --body "$RUNNER_TEMP/frontier-release-body.md" \
            --manifest "$MANIFEST" \
            --output "$RUNNER_TEMP/frontier-release-body-with-manifest.md"
          gh api --method PATCH \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            -F body=@"$RUNNER_TEMP/frontier-release-body-with-manifest.md" \
            > "$RUNNER_TEMP/frontier-release-updated.json"
          test "$(
            jq -r '.body' "$RUNNER_TEMP/frontier-release-updated.json" \
              | grep -c '^```rapp-frontier-release-manifest$'
          )" = 1

      - name: Attach only to the existing draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.context.outputs.release_id }}
          TAG: ${{ needs.context.outputs.tag }}
          VERSION: ${{ needs.context.outputs.version }}
          COMMIT: ${{ needs.context.outputs.commit }}
        run: |
          set -euo pipefail
          release="$(
            gh api -H "X-GitHub-Api-Version: 2026-03-10" \
              "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID"
          )"
          test "$(jq -r '.tag_name' <<<"$release")" = "$TAG"
          test "$(jq -r '.draft' <<<"$release")" = true
          test "$(jq -r '.prerelease' <<<"$release")" = true
          test "$(jq -r '.immutable // false' <<<"$release")" = false
          test "$(git rev-parse "$TAG^{commit}")" = "$COMMIT"

          mapfile -t existing_names < <(
            jq -r '.assets[].name' <<<"$release"
          )
          allowed_names=(
            "RAPP-Brainstem-Frontier-${VERSION}-macos-arm64.dmg"
            "RAPP-Brainstem-Frontier-${VERSION}-macos-arm64.dmg.gate.json"
            "RAPP-Brainstem-Frontier-${VERSION}-macos-arm64.dmg.sigstore.json"
            "RAPP-Brainstem-Frontier-${VERSION}-macos-x64.dmg"
            "RAPP-Brainstem-Frontier-${VERSION}-macos-x64.dmg.gate.json"
            "RAPP-Brainstem-Frontier-${VERSION}-macos-x64.dmg.sigstore.json"
            "RAPP-Brainstem-Frontier-${VERSION}-windows-x64-setup.exe"
            "RAPP-Brainstem-Frontier-${VERSION}-windows-x64-setup.exe.gate.json"
            "RAPP-Brainstem-Frontier-${VERSION}-windows-x64-setup.exe.sigstore.json"
            "RAPP-Brainstem-Frontier-${VERSION}-windows-x64-setup.exe.spdx.json"
            "RAPP-Brainstem-Frontier-${VERSION}-binary-manifest.json"
            "RAPP-Brainstem-Frontier-${VERSION}-binary-manifest.json.sigstore.json"
            "SHA256SUMS"
          )
          for existing in "${existing_names[@]}"; do
            if ! printf '%s\n' "${allowed_names[@]}" | grep -Fxq "$existing"; then
              echo "::error::unexpected pre-existing draft asset: $existing"
              exit 1
            fi
          done
          is_existing() {
            local wanted="$1"
            printf '%s\n' "${existing_names[@]}" | grep -Fxq "$wanted"
          }

          mkdir -p existing-release-assets
          for file in release-assets/*; do
            test -s "$file"
            name="$(basename "$file")"
            if is_existing "$name"; then
              if [[ "$name" = *.sigstore.json ]]; then
                echo "Preserving already-attached immutable provenance bundle: $name"
                continue
              fi
              gh release download "$TAG" --pattern "$name" --dir existing-release-assets
              if ! cmp -s "$file" "existing-release-assets/$name"; then
                echo "::error::$name already exists with different bytes; refusing to replace it"
                exit 1
              fi
              echo "Already attached with identical bytes: $name"
              continue
            fi
            gh release upload "$TAG" "$file"
          done

      - name: Verify draft assets, checksums, and attestations
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.context.outputs.release_id }}
          TAG: ${{ needs.context.outputs.tag }}
          VERSION: ${{ needs.context.outputs.version }}
          COMMIT: ${{ needs.context.outputs.commit }}
          WINDOWS_SIGNING_SUBJECT: ${{ vars.WINDOWS_SIGNING_SUBJECT }}
          AZURE_ARTIFACT_SIGNING_ENDPOINT: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          AZURE_ARTIFACT_SIGNING_ACCOUNT_NAME: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT_NAME }}
          AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE_NAME: ${{ vars.AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE_NAME }}
          AZURE_ARTIFACT_SIGNING_PROFILE_TYPE: ${{ vars.AZURE_ARTIFACT_SIGNING_PROFILE_TYPE }}
        run: |
          set -euo pipefail
          mkdir -p published-assets
          gh release download "$TAG" \
            --dir published-assets \
            --pattern "RAPP-Brainstem-Frontier-${VERSION}-*" \
            --pattern SHA256SUMS
          cd published-assets
          expected=(
            "RAPP-Brainstem-Frontier-${VERSION}-macos-arm64.dmg"
            "RAPP-Brainstem-Frontier-${VERSION}-macos-x64.dmg"
            "RAPP-Brainstem-Frontier-${VERSION}-windows-x64-setup.exe"
          )
          manifest="RAPP-Brainstem-Frontier-${VERSION}-binary-manifest.json"
          sha256sum -c SHA256SUMS
          for asset in "${expected[@]}"; do
            test -s "$asset"
            test -s "$asset.gate.json"
            test -s "$asset.sigstore.json"
            gh attestation verify "$asset" \
              --bundle "$asset.sigstore.json" \
              --repo "$GITHUB_REPOSITORY" \
              --source-digest "$COMMIT" \
              --source-ref "refs/tags/$TAG" \
              --deny-self-hosted-runners
          done
          test -s "$manifest"
          test -s "$manifest.sigstore.json"
          gh attestation verify "$manifest" \
            --bundle "$manifest.sigstore.json" \
            --repo "$GITHUB_REPOSITORY" \
            --source-digest "$COMMIT" \
            --source-ref "refs/tags/$TAG" \
            --deny-self-hosted-runners
          gh api -H "X-GitHub-Api-Version: 2026-03-10" \
            "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            > "$RUNNER_TEMP/frontier-staged-release.json"
          node "$GITHUB_WORKSPACE/beta/scripts/verify-staged-release.mjs" \
            --release-json "$RUNNER_TEMP/frontier-staged-release.json" \
            --artifact-dir "$PWD" \
            --manifest "$manifest" \
            --tag "$TAG" \
            --version "$VERSION" \
            --commit "$COMMIT"
          test "$(find . -maxdepth 1 -type f | wc -l | tr -d ' ')" = 13

      - name: Keep release draft until native redownload verification
        id: final-draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.context.outputs.release_id }}
          TAG: ${{ needs.context.outputs.tag }}
        run: |
          set -euo pipefail
          release="$(
            gh api -H "X-GitHub-Api-Version: 2026-03-10" \
              "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID"
          )"
          test "$(jq -r '.draft' <<<"$release")" = true
          test "$(jq -r '.tag_name' <<<"$release")" = "$TAG"
          printf '%s' "$release" \
            > "$RUNNER_TEMP/frontier-final-draft-release.json"
          release_fingerprint="$(
            node beta/scripts/release-race-guard.mjs \
              --fingerprint-file "$RUNNER_TEMP/frontier-final-draft-release.json"
          )"
          echo "release_fingerprint=$release_fingerprint" >> "$GITHUB_OUTPUT"

  redownload-macos:
    name: Redownload and verify macOS ${{ matrix.arch }}
    needs: [context, stage-release]
    if: needs.context.outputs.release_mode == 'true'
    environment: frontier-binary-release
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: macos-26-intel
            machine: x86_64
          - arch: arm64
            runner: macos-26
            machine: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Download staged draft assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.context.outputs.tag }}
        run: |
          mkdir redownload
          gh release download "$TAG" \
            --dir redownload \
            --pattern 'RAPP-Brainstem-Frontier-*' \
            --pattern SHA256SUMS

      - name: Reverify downloaded DMG, app, media, and notarization
        env:
          VERSION: ${{ needs.context.outputs.version }}
          MACOS_SIGNING_IDENTITY: ${{ vars.MACOS_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          ARCH: ${{ matrix.arch }}
          EXPECTED_MACHINE: ${{ matrix.machine }}
        run: |
          set -euo pipefail
          test "$(uname -m)" = "$EXPECTED_MACHINE"
          cd redownload
          test "$(find . -maxdepth 1 -type f | wc -l | tr -d ' ')" = 13
          shasum -a 256 -c SHA256SUMS
          dmg="RAPP-Brainstem-Frontier-${VERSION}-macos-${ARCH}.dmg"
          test -s "$dmg"
          hdiutil verify "$dmg"
          codesign --verify --deep --strict --verbose=4 "$dmg"
          dmg_signature="$(codesign -d --verbose=4 "$dmg" 2>&1)"
          grep -F "Authority=$MACOS_SIGNING_IDENTITY" <<<"$dmg_signature"
          grep -q '^Timestamp=' <<<"$dmg_signature"
          if grep -q 'Signature=adhoc' <<<"$dmg_signature"; then
            echo "DMG is ad-hoc signed" >&2
            exit 1
          fi
          xcrun stapler validate -v "$dmg"
          spctl --assess --type open --context context:primary-signature \
            --verbose=4 "$dmg"

          mount_point="$RUNNER_TEMP/frontier-redownload-${ARCH}"
          rm -rf "$mount_point"
          mkdir -p "$mount_point"
          cleanup() {
            hdiutil detach "$mount_point" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mount_point"
          app="$mount_point/RAPP Brainstem Frontier.app"
          test -d "$app"
          codesign --verify --deep --strict --verbose=4 "$app"
          app_signature="$(codesign -d --verbose=4 "$app" 2>&1)"
          grep -F "Authority=$MACOS_SIGNING_IDENTITY" <<<"$app_signature"
          grep -F "TeamIdentifier=$APPLE_TEAM_ID" <<<"$app_signature"
          grep -q '^Timestamp=' <<<"$app_signature"
          if grep -q 'Signature=adhoc' <<<"$app_signature"; then
            echo "App is ad-hoc signed" >&2
            exit 1
          fi
          xcrun stapler validate -v "$app"
          spctl --assess --type execute --verbose=4 "$app"

          mach_count=0
          while IFS= read -r -d '' candidate; do
            description="$(file -b "$candidate")"
            case "$description" in
              *Mach-O*)
                mach_count=$((mach_count + 1))
                if [ "$ARCH" = arm64 ]; then
                  grep -q arm64 <<<"$description"
                  if grep -q x86_64 <<<"$description"; then exit 1; fi
                else
                  grep -q x86_64 <<<"$description"
                  if grep -q arm64 <<<"$description"; then exit 1; fi
                fi
                ;;
            esac
          done < <(find "$app" -type f -print0)
          test "$mach_count" -ge 3

          ffmpeg="$(find "$app/Contents/Resources/app.asar.unpacked" -type f -name ffmpeg -print -quit)"
          ffprobe="$(find "$app/Contents/Resources/app.asar.unpacked" -type f -name ffprobe -print -quit)"
          copilot="$app/Contents/Resources/app.asar.unpacked/node_modules/@github/copilot-darwin-${ARCH}/copilot"
          test -x "$ffmpeg"
          test -x "$ffprobe"
          test -x "$copilot"
          ffmpeg_version="$("$ffmpeg" -version 2>&1)"
          ffprobe_version="$("$ffprobe" -version 2>&1)"
          if grep -q -- '--enable-nonfree' <<<"$ffmpeg_version"; then
            echo "Downloaded FFmpeg is nonfree and cannot be published" >&2
            exit 1
          fi
          test "$(awk 'NR == 1 { gsub(/^n/, "", $3); print $3 }' <<<"$ffmpeg_version")" = \
            "$(awk 'NR == 1 { gsub(/^n/, "", $3); print $3 }' <<<"$ffprobe_version")"
          "$copilot" --version

          jq -e \
            --arg identity "$MACOS_SIGNING_IDENTITY" \
            '.gate.status == "passed"
             and .publication.status == "ready"
             and .signing.identity == $identity
             and .runtime.copilot_auth_startup == true
             and .notarization.app.submission.status == "Accepted"
             and .notarization.app.log.status == "Accepted"
             and .notarization.app.log.issues == []
             and .notarization.dmg.submission.status == "Accepted"
             and .notarization.dmg.log.status == "Accepted"
             and .notarization.dmg.log.issues == []' \
            "$dmg.gate.json" >/dev/null
          hdiutil detach "$mount_point"
          trap - EXIT

  redownload-windows:
    name: Redownload and verify Windows x64
    needs: [context, stage-release]
    if: needs.context.outputs.release_mode == 'true'
    environment: windows-production
    permissions:
      contents: read
    runs-on: windows-2025
    steps:
      - name: Download staged draft assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.context.outputs.tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path redownload | Out-Null
          gh release download $env:TAG `
            --dir redownload `
            --pattern 'RAPP-Brainstem-Frontier-*' `
            --pattern SHA256SUMS

      - name: Reverify downloaded Authenticode and allowlist evidence
        shell: pwsh
        env:
          VERSION: ${{ needs.context.outputs.version }}
          WINDOWS_SIGNING_SUBJECT: ${{ vars.WINDOWS_SIGNING_SUBJECT }}
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location redownload
          $files = Get-ChildItem -File
          if ($files.Count -ne 13) { throw "Expected 13 release assets, found $($files.Count)" }
          foreach ($line in Get-Content SHA256SUMS) {
            if ($line -notmatch '^([0-9a-f]{64}) [ *](.+)$') {
              throw "Malformed SHA256SUMS line: $line"
            }
            $expected = $Matches[1]
            $name = $Matches[2]
            $item = Get-Item -LiteralPath $name
            if ($item.Length -lt 1) { throw "$name is empty" }
            $actual = (Get-FileHash -LiteralPath $name -Algorithm SHA256).Hash
            if ($actual -ne $expected) { throw "$name SHA-256 mismatch" }
          }

          $installer = "RAPP-Brainstem-Frontier-$env:VERSION-windows-x64-setup.exe"
          $signtool = (Get-Command signtool.exe -ErrorAction SilentlyContinue).Source
          if (-not $signtool) {
            $kits = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\bin'
            $signtool = Get-ChildItem -LiteralPath $kits -Filter signtool.exe -Recurse |
              Where-Object FullName -Match '\\x64\\signtool\.exe$' |
              Sort-Object FullName -Descending |
              Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $signtool) { throw 'signtool.exe is missing' }
          & $signtool verify /pa /all /v /tw $installer
          if ($LASTEXITCODE -in 1, 2) {
            throw "signtool verification failed with exit $LASTEXITCODE"
          }
          if ($LASTEXITCODE -ne 0) {
            throw "signtool verification failed with unexpected exit $LASTEXITCODE"
          }
          $signature = Get-AuthenticodeSignature -LiteralPath $installer
          if ($signature.Status -ne 'Valid') { throw "Installer signature is $($signature.Status)" }
          if ($signature.SignerCertificate.Subject -ne $env:WINDOWS_SIGNING_SUBJECT) {
            throw "Installer publisher mismatch"
          }
          if (-not $signature.TimeStamperCertificate) { throw 'Installer timestamp is missing' }

          $sbomPath = "$installer.spdx.json"
          $sbom = Get-Content -LiteralPath $sbomPath -Raw | ConvertFrom-Json
          if ($sbom.spdxVersion -ne 'SPDX-2.3' -or
              $sbom.name -notlike '@aibast/rapp-brainstem-frontier@*' -or
              $sbom.packages.Count -lt 1) {
            throw 'Downloaded Windows SPDX SBOM is invalid'
          }

          $report = Get-Content "$installer.gate.json" -Raw | ConvertFrom-Json
          if ($report.gate.status -ne 'passed' -or
              $report.publication.status -ne 'ready' -or
              -not $report.runtime.copilot_auth_startup -or
              -not $report.execution.windows_standard_user -or
              -not $report.execution.windows_lifecycle.passed -or
              -not $report.execution.windows_lifecycle.per_user_registry_only -or
              $report.execution.windows_lifecycle.machine_registry_entries -ne 0 -or
              -not $report.execution.windows_lifecycle.reinstall_single_entry -or
              -not $report.execution.windows_lifecycle.installed_files_removed -or
              -not $report.execution.windows_lifecycle.registry_and_shortcuts_removed -or
              -not $report.execution.windows_lifecycle.shared_brainstem_preserved -or
              -not $report.execution.windows_lifecycle.user_data_preserved -or
              -not $report.execution.windows_lifecycle.source_migration_safe -or
              -not $report.execution.windows_upgrade.passed -or
              $report.execution.windows_upgrade.mode -notin @(
                'first-binary-release',
                'n-minus-one-to-n'
              ) -or
              -not $report.native_media.publication_ready -or
              $report.signing.identity -ne $env:WINDOWS_SIGNING_SUBJECT) {
            throw 'Downloaded Windows gate report is not release-ready'
          }

  quarantine-macos:
    name: Protected clean-Mac quarantine acceptance
    needs: [context, stage-release]
    if: needs.context.outputs.release_mode == 'true'
    environment: frontier-clean-mac-acceptance
    permissions:
      contents: read
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.context.outputs.commit }}

      - name: Download, quarantine, copy to Applications, and launch
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.context.outputs.tag }}
          VERSION: ${{ needs.context.outputs.version }}
          COMMIT: ${{ needs.context.outputs.commit }}
        run: |
          set -euo pipefail
          download_dir="$RUNNER_TEMP/frontier-quarantine-download"
          evidence_dir="$GITHUB_WORKSPACE/quarantine-acceptance"
          acceptance_home="$RUNNER_TEMP/frontier-clean-user"
          brainstem_home="$acceptance_home/.brainstem"
          user_data="$acceptance_home/Library/Application Support/RAPP Brainstem Frontier"
          status_file="$acceptance_home/frontier-smoke-status.json"
          installed_app="/Applications/RAPP Brainstem Frontier.app"
          dmg_name="RAPP-Brainstem-Frontier-${VERSION}-macos-arm64.dmg"
          dmg="$download_dir/$dmg_name"
          mount_point="$RUNNER_TEMP/frontier-quarantine-volume"
          mkdir -p "$download_dir" "$evidence_dir" "$acceptance_home" "$mount_point"
          test ! -e "$brainstem_home"
          sudo rm -rf "$installed_app"

          mounted=0
          cleanup() {
            for name in \
              HOME USERPROFILE BRAINSTEM_HOME BRAINSTEM_BETA_HOME \
              BRAINSTEM_BETA_USER_DATA_DIR BRAINSTEM_BETA_SMOKE_STATUS_FILE \
              BRAINSTEM_BETA_SMOKE_EXIT_MS BRAINSTEM_BETA_SMOKE_EXIT_ON_READY \
              BRAINSTEM_BETA_SMOKE_REQUIRE_READY BRAINSTEM_BETA_HEADLESS \
              BRAINSTEM_BETA_CAPTURE_USER_DATA_PATH; do
              launchctl unsetenv "$name" >/dev/null 2>&1 || true
            done
            if [ "$mounted" = 1 ]; then
              hdiutil detach "$mount_point" >/dev/null 2>&1 || true
            fi
            sudo rm -rf "$installed_app"
            rm -rf "$acceptance_home"
          }
          trap cleanup EXIT

          gh release download "$TAG" \
            --dir "$download_dir" \
            --pattern "$dmg_name" \
            --pattern "$dmg_name.gate.json" \
            --pattern SHA256SUMS
          expected_sha="$(
            awk -v name="$dmg_name" '$2 == name { print $1 }' \
              "$download_dir/SHA256SUMS"
          )"
          test "$expected_sha" = "$(shasum -a 256 "$dmg" | awk '{print $1}')"
          ticket="0083;$(printf '%x' "$(date +%s)");GitHubActions;${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          xattr -w com.apple.quarantine "$ticket" "$dmg"
          test "$(xattr -p com.apple.quarantine "$dmg")" = "$ticket"
          hdiutil verify "$dmg"
          codesign --verify --deep --strict --verbose=4 "$dmg"
          xcrun stapler validate -v "$dmg"
          spctl --assess --type open --context context:primary-signature \
            --verbose=4 "$dmg"
          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mount_point"
          mounted=1
          source_app="$mount_point/RAPP Brainstem Frontier.app"
          test -d "$source_app"
          sudo ditto "$source_app" "$installed_app"
          sudo xattr -w com.apple.quarantine "$ticket" "$installed_app"
          installed_ticket="$(xattr -p com.apple.quarantine "$installed_app")"
          test "$installed_ticket" = "$ticket"
          codesign --verify --deep --strict --verbose=4 "$installed_app"
          xcrun stapler validate -v "$installed_app"
          gatekeeper_output="$(
            spctl --assess --type execute --verbose=4 "$installed_app" 2>&1
          )"

          launchctl setenv HOME "$acceptance_home"
          launchctl setenv USERPROFILE "$acceptance_home"
          launchctl setenv BRAINSTEM_HOME "$brainstem_home"
          launchctl setenv BRAINSTEM_BETA_HOME "$brainstem_home/beta-launcher"
          launchctl setenv BRAINSTEM_BETA_USER_DATA_DIR "$user_data"
          launchctl setenv BRAINSTEM_BETA_SMOKE_STATUS_FILE "$status_file"
          launchctl setenv BRAINSTEM_BETA_SMOKE_EXIT_MS 840000
          launchctl setenv BRAINSTEM_BETA_SMOKE_EXIT_ON_READY 1
          launchctl setenv BRAINSTEM_BETA_SMOKE_REQUIRE_READY 1
          launchctl setenv BRAINSTEM_BETA_HEADLESS 1
          launchctl setenv BRAINSTEM_BETA_CAPTURE_USER_DATA_PATH 1

          open -W -n "$installed_app" \
            >"$evidence_dir/launchservices.log" 2>&1
          test -s "$status_file"
          jq -e \
            --arg user_data "$user_data" \
            '.brainstem.phase == "ready"
             and (.copilot.phase == "ready" or .copilot.phase == "signed-out")
             and .provisioned == true
             and .requestedUserData == $user_data
             and .actualUserData == $user_data' \
            "$status_file" >/dev/null
          test "$(git -C "$brainstem_home/src" rev-parse HEAD)" = "$COMMIT"
          jq -e \
            '.gate.status == "passed"
             and .publication.status == "ready"
             and .notarization.app.log.issues == []
             and .notarization.dmg.log.issues == []' \
            "$download_dir/$dmg_name.gate.json" >/dev/null

          export ACCEPTANCE_DMG="$dmg_name"
          export ACCEPTANCE_SHA="$expected_sha"
          export ACCEPTANCE_TICKET="$ticket"
          export ACCEPTANCE_APP="$installed_app"
          export ACCEPTANCE_STATUS="$status_file"
          export ACCEPTANCE_GATEKEEPER="$gatekeeper_output"
          node - "$evidence_dir/quarantine-acceptance.json" <<'NODE'
          const fs = require("node:fs");
          const output = process.argv[2];
          fs.writeFileSync(output, `${JSON.stringify({
            schema: "rapp-brainstem-frontier-quarantine-acceptance/v1",
            release: {
              tag: process.env.TAG,
              commit: process.env.COMMIT,
              version: process.env.VERSION,
            },
            download: {
              filename: process.env.ACCEPTANCE_DMG,
              sha256: process.env.ACCEPTANCE_SHA,
              quarantine: process.env.ACCEPTANCE_TICKET,
            },
            installation: {
              method: "quarantined-dmg-copy-to-applications",
              path: process.env.ACCEPTANCE_APP,
            },
            launch: {
              method: "LaunchServices open -W -n",
              gatekeeper: process.env.ACCEPTANCE_GATEKEEPER,
              status: JSON.parse(
                fs.readFileSync(process.env.ACCEPTANCE_STATUS, "utf8"),
              ),
            },
            run_url:
              `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}`
              + `/actions/runs/${process.env.GITHUB_RUN_ID}`,
          }, null, 2)}\n`, { mode: 0o600 });
          NODE

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontier-clean-mac-quarantine-acceptance
          path: quarantine-acceptance/
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish immutable release after redownload verification
    needs:
      - context
      - stage-release
      - redownload-macos
      - redownload-windows
      - quarantine-macos
    if: needs.context.outputs.release_mode == 'true'
    environment: frontier-binary-release
    permissions:
      contents: write
      attestations: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.context.outputs.commit }}

      - name: Publish and assert GitHub immutability
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.context.outputs.release_id }}
          RELEASE_FINGERPRINT: ${{ needs.stage-release.outputs.release_fingerprint }}
          TAG: ${{ needs.context.outputs.tag }}
          TAG_OBJECT: ${{ needs.context.outputs.tag_object }}
          VERSION: ${{ needs.context.outputs.version }}
          COMMIT: ${{ needs.context.outputs.commit }}
          WINDOWS_SIGNING_SUBJECT: ${{ vars.WINDOWS_SIGNING_SUBJECT }}
          AZURE_ARTIFACT_SIGNING_ENDPOINT: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          AZURE_ARTIFACT_SIGNING_ACCOUNT_NAME: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT_NAME }}
          AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE_NAME: ${{ vars.AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE_NAME }}
          AZURE_ARTIFACT_SIGNING_PROFILE_TYPE: ${{ vars.AZURE_ARTIFACT_SIGNING_PROFILE_TYPE }}
        run: |
          set -euo pipefail
          mkdir publish-verification
          manifest="RAPP-Brainstem-Frontier-${VERSION}-binary-manifest.json"
          gh release download "$TAG" \
            --dir publish-verification \
            --pattern "RAPP-Brainstem-Frontier-${VERSION}-*" \
            --pattern SHA256SUMS
          (
            cd publish-verification
            test "$(find . -maxdepth 1 -type f | wc -l | tr -d ' ')" = 13
            sha256sum -c SHA256SUMS
            for asset in \
              "RAPP-Brainstem-Frontier-${VERSION}-macos-arm64.dmg" \
              "RAPP-Brainstem-Frontier-${VERSION}-macos-x64.dmg" \
              "RAPP-Brainstem-Frontier-${VERSION}-windows-x64-setup.exe"; do
              gh attestation verify "$asset" \
                --bundle "$asset.sigstore.json" \
                --repo "$GITHUB_REPOSITORY" \
                --source-digest "$COMMIT" \
                --source-ref "refs/tags/$TAG" \
                --deny-self-hosted-runners
            done
            gh attestation verify "$manifest" \
              --bundle "$manifest.sigstore.json" \
              --repo "$GITHUB_REPOSITORY" \
              --source-digest "$COMMIT" \
              --source-ref "refs/tags/$TAG" \
              --deny-self-hosted-runners
          )
          before="$(
            gh api -H "X-GitHub-Api-Version: 2026-03-10" \
              "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID"
          )"
          test "$(jq -r '.draft' <<<"$before")" = true
          printf '%s' "$before" > "$RUNNER_TEMP/frontier-prepublish-release.json"
          node beta/scripts/verify-staged-release.mjs \
            --release-json "$RUNNER_TEMP/frontier-prepublish-release.json" \
            --artifact-dir publish-verification \
            --manifest "publish-verification/$manifest" \
            --tag "$TAG" \
            --version "$VERSION" \
            --commit "$COMMIT"
          immutable_settings="$RUNNER_TEMP/frontier-immutable-release-settings.json"
          if ! gh api \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "repos/$GITHUB_REPOSITORY/immutable-releases" \
            >"$immutable_settings"; then
            echo "::error title=Publication blocked::Repository immutable releases are not enabled or could not be verified. The draft remains unpublished."
            exit 1
          fi
          if ! jq -e '.enabled == true' "$immutable_settings" >/dev/null; then
            echo "::error title=Publication blocked::Repository immutable release settings returned enabled=false or invalid JSON. The draft remains unpublished."
            exit 1
          fi
          node beta/scripts/immutable-release-policy.mjs \
            --input "$immutable_settings"
          transition_state="$RUNNER_TEMP/frontier-release-transition-state.json"
          final_release="$RUNNER_TEMP/frontier-final-immutable-release.json"
          report_transition_error() {
            echo "::error title=Release transition failed::The ID-bound publication state machine returned nonzero."
          }
          report_transition_exit() {
            status=$?
            if [ "$status" -ne 0 ]; then
              if [ -s "$transition_state" ]; then
                cat "$transition_state" >&2
              else
                echo "::error title=IMMUTABLE RELEASE INCIDENT::No transition state was recorded; release state is unproven."
              fi
            fi
          }
          trap report_transition_error ERR
          trap report_transition_exit EXIT
          node beta/scripts/publish-release-state-machine.mjs \
            --repository "$GITHUB_REPOSITORY" \
            --release-id "$RELEASE_ID" \
            --tag "$TAG" \
            --tag-object "$TAG_OBJECT" \
            --commit "$COMMIT" \
            --release-fingerprint "$RELEASE_FINGERPRINT" \
            --state-file "$transition_state" \
            --output "$final_release"
          jq -e \
            --arg id "$RELEASE_ID" \
            --arg tag "$TAG" \
            '.immutable == true and .draft == false
             and (.id | tostring) == $id and .tag_name == $tag' \
            "$final_release" >/dev/null
          trap - ERR EXIT
          echo "Published immutable $TAG at $COMMIT after native redownload verification."

      - name: Recover interrupted mutable release transition
        if: ${{ failure() || cancelled() }}
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.context.outputs.release_id }}
          RELEASE_FINGERPRINT: ${{ needs.stage-release.outputs.release_fingerprint }}
          TAG: ${{ needs.context.outputs.tag }}
          TAG_OBJECT: ${{ needs.context.outputs.tag_object }}
          COMMIT: ${{ needs.context.outputs.commit }}
        run: |
          set -euo pipefail
          transition_state="$RUNNER_TEMP/frontier-release-transition-state.json"
          recovery_output="$RUNNER_TEMP/frontier-recovered-release.json"
          if [ ! -s "$transition_state" ]; then
            echo "No publication transition state exists; no recovery PATCH is required."
            exit 0
          fi
          if ! jq -e '.transitionAttempted == true' "$transition_state" >/dev/null; then
            echo "Publication transition was not attempted; no recovery PATCH is required."
            exit 0
          fi
          node beta/scripts/publish-release-state-machine.mjs \
            --recover-only \
            --repository "$GITHUB_REPOSITORY" \
            --release-id "$RELEASE_ID" \
            --tag "$TAG" \
            --tag-object "$TAG_OBJECT" \
            --commit "$COMMIT" \
            --release-fingerprint "$RELEASE_FINGERPRINT" \
            --state-file "$transition_state" \
            --output "$recovery_output"
          jq -e \
            '.immutable == true or .draft == true' \
            "$recovery_output" >/dev/null
