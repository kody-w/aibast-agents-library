name: RAPP/1 Corpus Integrity

on:
  schedule:
    - cron: '15 6 * * 1'  # weekly, Monday 06:15 UTC
  workflow_dispatch:
  pull_request:
    paths:
      - 'rapp/**'
      - 'scripts/corpus_sync.py'
      - '.github/workflows/corpus-check.yml'

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify corpus mirrors (local + upstream pins)
        id: check
        run: python scripts/corpus_sync.py --check
      - name: Open drift issue
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # the alerting path must itself fail loudly if it cannot alert
          gh label create corpus-drift --color D93F0B \
            --description "RAPP/1 corpus mirror drift detected by corpus-check" 2>/dev/null || true
          if ! gh issue create \
            --title "corpus pin violation / upstream drift ($(date -u +%Y-%m-%d))" \
            --body "Weekly corpus check failed. Run \`python3 scripts/corpus_sync.py --check\` locally; see rapp/SUCCESSION.md for the pin-bump process. Observe-only: nothing was changed automatically." \
            --label "corpus-drift"; then
            echo "::error::corpus drift detected but the drift issue could not be created"
            exit 1
          fi
