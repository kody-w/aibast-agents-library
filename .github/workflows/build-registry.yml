name: Build Agent Registry

on:
  push:
    paths:
      - 'agents/**/*.py'
      - 'build_registry.py'
      - 'registry.json'
      - 'academy/catalog.json'
      - 'academy.json'
      - 'scripts/build_academy.py'
      - 'solutions/catalog.json'
      - 'state/workshop_course_rollout.json'
      - 'solutions/*/quest.html'
      - 'solutions/*/manual-tutorial.html'
      - 'solutions/*/field-guide.html'
      - 'solutions/*/evidence-report.html'
      - 'solutions/*/manual/skills/*/SKILL.md'
      - '.github/workflows/build-registry.yml'
  pull_request:
    paths:
      - 'agents/**/*.py'
      - 'build_registry.py'
      - 'registry.json'
      - 'academy/catalog.json'
      - 'academy.json'
      - 'scripts/build_academy.py'
      - 'solutions/catalog.json'
      - 'state/workshop_course_rollout.json'
      - 'solutions/*/quest.html'
      - 'solutions/*/manual-tutorial.html'
      - 'solutions/*/field-guide.html'
      - 'solutions/*/evidence-report.html'
      - 'solutions/*/manual/skills/*/SKILL.md'
      - '.github/workflows/build-registry.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Check committed academy catalog
        if: github.event_name == 'pull_request'
        run: python scripts/build_academy.py --check

      - name: Build registry
        run: python build_registry.py

      - name: Build academy catalog
        run: python scripts/build_academy.py

      - name: Commit generated catalogs
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "RAPP Registry Bot"
          git config user.email "rapp-bot@users.noreply.github.com"
          git add registry.json academy.json
          git diff --cached --quiet || git commit -m "Auto-build generated catalogs [skip ci]"
          git push
